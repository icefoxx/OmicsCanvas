id: radviz_plot
name: Wheel / RadViz
version: 1.0.0
description: Project nonnegative feature weights toward labeled vertices of a wheel.
language: R
entrypoint: plot.R
category: Dimension
subcategory: Embedding
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- vertices_used.csv
runtime:
  command: Rscript plugins/radviz_plot/plot.R --input input.csv --params params.json
    --output output_dir
