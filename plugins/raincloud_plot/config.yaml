id: raincloud_plot
name: Raincloud Plot
version: 1.0.0
description: Half-violin, box, and jittered points for group distributions.
language: R
entrypoint: plot.R
category: Distribution
subcategory: General
status: beta
inputs:
- id: input
  type: table
  formats: [csv, tsv, txt]
  required: true
outputs: [result.svg, result.pdf, result.png, figure.json, run.log, data_used.csv]
runtime:
  command: Rscript plugins/raincloud_plot/plot.R --input input.csv --params params.json --output output_dir
