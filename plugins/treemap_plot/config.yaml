id: treemap_plot
name: Treemap Plot
version: 1.0.0
description: Hierarchical category shares as nested rectangles.
language: R
entrypoint: plot.R
category: Composition
subcategory: Hierarchical
status: beta
inputs:
- id: input
  type: table
  formats: [csv, tsv, txt]
  required: true
outputs: [result.svg, result.pdf, result.png, figure.json, run.log, data_used.csv]
runtime:
  command: Rscript plugins/treemap_plot/plot.R --input input.csv --params params.json --output output_dir
