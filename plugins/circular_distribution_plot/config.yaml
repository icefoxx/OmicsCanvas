id: circular_distribution_plot
name: Circular Score Distribution
version: 1.0.0
description: Compare numeric score distributions and highlighted observations on concentric
  arcs.
language: R
entrypoint: plot.R
category: Distribution
subcategory: General
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
runtime:
  command: Rscript plugins/circular_distribution_plot/plot.R --input input.csv --params
    params.json --output output_dir
