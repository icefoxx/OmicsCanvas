id: risk_stratification_panel
name: Risk Stratification Panel
version: 1.0.0
description: Align supplied risk ranks, event follow-up and selected numeric features.
language: R
entrypoint: plot.R
category: Multi-panel
subcategory: Annotation
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- features_used.csv
runtime:
  command: Rscript plugins/risk_stratification_panel/plot.R --input input.csv --params
    params.json --output output_dir
