id: forest_plot
name: Forest Plot
version: 1.0.0
description: Compare supplied effect estimates and confidence intervals.
language: R
entrypoint: plot.R
category: Comparison
subcategory: Effect
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
runtime:
  command: Rscript plugins/forest_plot/plot.R --input input.csv --params params.json
    --output output_dir
