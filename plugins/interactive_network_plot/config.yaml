id: interactive_network_plot
name: Interactive Network Plot
version: 1.1.0
description: Interactive edge-list and membership graph with preset layouts and a draggable HTML view.
language: R
entrypoint: plot.R
category: Network
subcategory: General
status: experimental
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
- id: nodes
  type: table
  required: false
outputs:
- result.svg
- result.pdf
- result.png
- result.html
- figure.json
- nodes_used.csv
- edges_used.csv
- run.log
parameters:
  input_mode:
    type: select
    options:
    - edge_list
    - membership
    default: edge_list
  layout_algorithm:
    type: select
    options:
    - fr
    - kk
    - circle
    - concentric
    - radial
    - stress
    - hierarchical
    - manual
    default: fr
  layout_sort:
    type: select
    options:
    - none
    - degree
    - size
    - label
    default: none
  ring_gap:
    type: number
    default: 1
  edge_weighted:
    type: boolean
    default: true
  edge_style:
    type: select
    options:
    - link
    - arc
    default: link
  node_size_by:
    type: select
    options:
    - degree
    - constant
    - size_column
    default: degree
  node_color_mode:
    type: select
    options:
    - group
    - gradient
    default: group
  interactive:
    type: boolean
    default: true
  group_colors:
    type: object
    required: false
  highlight_nodes:
    type: string_array
    required: false
