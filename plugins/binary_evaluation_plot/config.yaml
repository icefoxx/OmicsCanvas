id: binary_evaluation_plot
name: Binary Model Evaluation
version: 1.0.0
description: "ROC, precision\u2013recall, calibration and decision curves from supplied\
  \ predictions."
language: R
entrypoint: plot.R
category: Benchmark
subcategory: General
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- metrics_used.csv
runtime:
  command: Rscript plugins/binary_evaluation_plot/plot.R --input input.csv --params
    params.json --output output_dir
