id: ternary_plot
name: Ternary Plot
version: 1.0.0
description: Three-part compositions on a simplex, with optional grouping and size mapping.
language: R
entrypoint: plot.R
category: Scatter
subcategory: Ternary
status: beta
inputs:
- id: input
  type: table
  formats: [csv, tsv, txt]
  required: true
outputs: [result.svg, result.pdf, result.png, figure.json, run.log, data_used.csv]
runtime:
  command: Rscript plugins/ternary_plot/plot.R --input input.csv --params params.json --output output_dir
