id: interactive_sankey_plot
name: Interactive Sankey / Alluvial Flow
version: 1.0.0
description: Highly customizable draggable Sankey flow plot with static vector/raster exports.
language: R
entrypoint: plot.R
category: Network
subcategory: General
status: stable
inputs:
- id: input
  type: table
  required: true
  description: Flow table with source
  target: null
  value and optional stage/group columns.: null
- id: nodes
  type: table
  required: false
  description: Optional node id
  label: null
  stage/order: null
  color: null
  x: null
  y: null
  highlight table.: null
outputs:
- result.svg
- result.pdf
- result.png
- result.html
- figure.json
- run.log
- nodes_used.csv
- edges_used.csv
- selected_nodes.csv
runtime:
  command: Rscript plot.R --input flows.csv --params params.json --output output_dir [--nodes nodes.csv]
