name: stat_plot
category: Expression / Statistics
subcategory: Statistics
display_name: Stat Plot
description: Standardized SCA statPlot wrapper for counts/percentages of categorical metadata levels across groups, with bar/rose/ring/pie/trend/area/dot/sankey/chord/venn/upset plot types.
runtime:
  command: Rscript plot.R --input metadata.csv --params params.json --output output_dir
inputs:
  - name: input
    type: table
    required: true
    description: Metadata CSV/TSV/TXT. Rows are cells/samples; columns are categorical/numeric variables. First column is the row id by default.
outputs:
  - result.svg
  - result.pdf
  - result.png
  - figure.json
  - selected_rows.csv
  - run.log
plot_types:
  - bar
  - rose
  - ring
  - pie
  - trend
  - area
  - dot
  - sankey
  - chord
  - venn
  - upset
notes:
  - Wraps SCA statPlot.R::statPlot().
  - Preserves SCA visual style (themeDefault, paletteCustomize).
  - force is always TRUE in CLI mode to avoid interactive >100-level prompts.
  - chord uses base graphics via recordPlot and is replayed onto the output device.
