id: interactive_3d_scatter
name: 3D Embedding
version: 1.0.0
description: View supplied three-dimensional coordinates with an interactive scene
  and vector projection.
language: R
entrypoint: plot.R
category: Dimension
subcategory: Embedding
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- result.html
runtime:
  command: Rscript plugins/interactive_3d_scatter/plot.R --input input.csv --params
    params.json --output output_dir
