id: oncoprint_plot
name: Mutation Matrix
version: 1.0.0
description: Show multiple alteration types per gene and sample with marginal frequencies.
language: R
entrypoint: plot.R
category: Heatmap
subcategory: Matrix
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- gene_frequencies_used.csv
- tiles_used.csv
runtime:
  command: Rscript plugins/oncoprint_plot/plot.R --input input.csv --params params.json
    --output output_dir
