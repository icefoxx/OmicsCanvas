id: balloon_plot
name: Balloon Plot
version: 1.0.0
description: Rewritten, customizable version of the SCA statBalloonplot function. Plots a tile/balloon matrix where each cell
  is sized by its value, with optional row/column summary statistics on the margins.
language: R
entrypoint: plot.R
category: Heatmap
subcategory: Matrix
status: stable
inputs:
- id: input
  type: table
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- selected_rows.csv (when row filtering or highlight applied)
runtime:
  command: Rscript plot.R --input matrix.csv --params params.json --output output_dir
