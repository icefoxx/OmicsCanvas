id: exp_stat_plot
name: Expression Statistic Plot
version: 1.0.0
description: Standardized SCA expStatPlot wrapper for highly customizable expression and metadata statistic plots.
language: R
entrypoint: plot.R
category: Expression / Statistics
subcategory: Statistics
status: stable
inputs:
- id: input
  type: table
  required: true
  description: Metadata table. Rows are cells/samples; first column is the id by default.
- id: expr
  type: matrix
  required: false
  description: Optional expression matrix. First column is gene/feature id; columns are cells/samples.
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- selected_rows.csv
- run.log
runtime:
  command: Rscript plot.R --input metadata.csv --expr expression.csv --params params.json --output output_dir
