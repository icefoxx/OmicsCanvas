id: embedding_vector_plot
name: Embedding Vector Field
version: 1.0.0
description: Overlay supplied displacement vectors on an embedding without inferring
  velocities.
language: R
entrypoint: plot.R
category: Dimension
subcategory: Trajectory
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- arrows_used.csv
runtime:
  command: Rscript plugins/embedding_vector_plot/plot.R --input input.csv --params
    params.json --output output_dir
