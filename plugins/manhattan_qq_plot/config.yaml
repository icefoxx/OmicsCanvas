id: manhattan_qq_plot
name: Manhattan / QQ
version: 1.0.0
description: Display genomic association probabilities and their expected-quantile
  comparison.
language: R
entrypoint: plot.R
category: Genomics
subcategory: General
status: beta
inputs:
- id: input
  type: table
  formats:
  - csv
  - tsv
  - txt
  required: true
outputs:
- result.svg
- result.pdf
- result.png
- figure.json
- run.log
- data_used.csv
- qq_used.csv
runtime:
  command: Rscript plugins/manhattan_qq_plot/plot.R --input input.csv --params params.json
    --output output_dir
