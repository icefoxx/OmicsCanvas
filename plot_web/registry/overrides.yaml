# Curated registry overlays. Auto-scan of plugins/*/ fills families; this file
# supplies scientific metadata, UMAP reference variants, and example classifications.

hidden_families:
  - den_plot
  - feature_density_plot
  - stat_plot
  - interactive_clustered_heatmap_plot
  - balloon_plot
  - interactive_binary_plot
  - sankey
  - combo_bar_line_plot
  - gsea_ridge_nes_plot
  - classified_bar_plot
  - gsea_heatmap
  - stacked_bar_plot
  - interactive_dual_triangle_heatmap_plot
  - pie_dot_matrix

family_id_map:
  advanced_dim_plot: umap_tsne
  sca_volcano_plot: volcano
  fgsea_enrichment_plot: gsea
  gsea_pathway_heatmap: gsea_heatmap
  group_heatmap: grouped_heatmap
  lineage_plot: trajectory
  dynamic_venn_diagram: venn
  interactive_upset_plot: upset
  interactive_enrichment_lollipop: enrichment_lollipop
  interactive_ridgeline_plot: ridgeline
  interactive_sankey_plot: sankey
  alluvial_plot: alluvial
  advanced_feature_plot: feature_embedding

families:
  umap_tsne:
    name: UMAP / t-SNE
    short_name: UMAP
    description: Dimensionality reduction plots for cell embeddings.
    aliases:
      - umap
      - tsne
      - embedding
      - dimensional reduction
      - cell map
      - dimplot
      - advanced_dim_plot
      - advDimPlot
      - basic umap
      - feature expression
      - composition
      - cluster_composition_ring
      - embedded_pie
      - ellipse_mark
      - highlight_cells
      - background_mask
      - coexpression_screen
      - density_hex
      - split_highlight
    categories: [single_cell, dimension_reduction]
    analysis_contexts: [single_cell, cell_clustering, gene_expression, cell_composition]
    tasks: [clustering, feature_expression, composition, density, highlighting, trajectory]
    data_requirements:
      required_roles: [x_embedding, y_embedding]
      optional_roles: [cluster, sample, condition, feature, metadata, split]
      accepted_types:
        x_embedding: numeric
        y_embedding: numeric
        cluster: categorical
        sample: categorical
        condition: categorical
        feature: numeric
        split: categorical
    recommendation_rules:
      - when: {has_embedding_xy: true, has_cluster: true}
        recommend: {variant: clusters, priority: 100}
      - when: {has_embedding_xy: true, has_sample: true}
        recommend: {variant: split_samples, priority: 80}
      - when: {has_embedding_xy: true, has_cluster: true, has_sample: true}
        recommend: {variant: composition, priority: 90}
      - when: {has_embedding_xy: true, has_feature: true}
        recommend: {variant: feature_expression, priority: 95}
    variants:
      - id: clusters
        name: Basic UMAP
        short_description: Color cells by cluster or annotation on a 2D embedding.
        description: Color cells by cluster or annotation.
        recommended_for: [cell_clustering]
        parameter_groups: [data_mapping, marks, colors, labels, legend, axes, theme, export]
        gallery: {visible: true, section: recommended, order: 1}
        representative_example: pdf_repro_basic_umap
      - id: feature_expression
        name: Feature Expression
        short_description: Map numeric feature expression onto the embedding.
        description: Map numeric feature expression onto the embedding.
        recommended_for: [gene_expression]
        parameter_groups: [data_mapping, colors, legend, axes, export]
        gallery: {visible: true, section: recommended, order: 2}
        representative_example: feature
      - id: split_samples
        name: Split by Sample
        short_description: Facet the embedding by sample or condition.
        description: Facet the embedding by sample or condition.
        recommended_for: [sample_comparison]
        gallery: {visible: true, section: recommended, order: 3}
        representative_example: pdf_repro_split_samples
      - id: composition
        name: Composition
        short_description: Show categorical composition within embedding-defined groups using pie or ring glyphs.
        description: Embedded pie or ring glyphs summarize category fractions inside clusters.
        recommended_for: [cell_composition]
        gallery: {visible: true, section: recommended, order: 4}
        representative_example: pdf_repro_composition_ring
      - id: highlight_cells
        name: Highlight Cells
        short_description: Emphasize a cell subset and fade the rest.
        description: Emphasize a cell subset; fade the rest.
        recommended_for: [highlighting]
        gallery: {visible: true, section: recommended, order: 5}
        representative_example: pdf_repro_highlight_cells
      - id: ellipse
        name: Ellipse Marks
        short_description: Outline groups with ellipse, hull, rectangle, or circle marks.
        description: Confidence ellipses or related marks around groups.
        recommended_for: [cell_clustering]
        gallery: {visible: true, section: recommended, order: 6}
        representative_example: pdf_repro_ellipse_mark
      - id: density
        name: Density
        short_description: Show local cell density as filled contours, contour lines, or hexbins.
        description: Density overlay or hexbin aggregation on the embedding.
        recommended_for: [density]
        gallery: {visible: true, section: more, order: 7}
        representative_example: density_filled
      - id: coexpression
        name: Coexpression Map
        short_description: Mix two or more features onto the embedding with blended color.
        description: Blend multiple features on the embedding.
        recommended_for: [gene_expression]
        gallery: {visible: true, section: more, order: 8}
        representative_example: coexpression
      - id: background_mask
        name: Background / Mask
        short_description: Dim cells by category, numeric cutoff, or selected IDs.
        description: Push cells into the background by metadata category, numeric cutoff, or selection.
        recommended_for: [highlighting]
        gallery: {visible: true, section: more, order: 9}
        representative_example: pdf_repro_bg_cutoff_mito
      - id: split_highlight
        name: Split & Highlight
        short_description: Facet by sample or condition while highlighting a cell subset.
        description: Combine split panels with a scientifically meaningful cell highlight.
        recommended_for: [sample_comparison, highlighting]
        gallery: {visible: true, section: more, order: 10}
        representative_example: split_highlight
      - id: lineage
        name: Lineage
        short_description: Overlay lineage, trajectory, or path information on the embedding.
        description: Overlay lineage/trajectory paths on the embedding.
        recommended_for: [trajectory]
        gallery: {visible: true, section: more, order: 11}
        representative_example: lineage
      - id: stat_panel
        name: Embedding + Statistical Panel
        short_description: Pair the embedding with a quantitative composition or count panel.
        description: Side statistics panel next to the embedding.
        recommended_for: [cell_composition]
        gallery: {visible: true, section: more, order: 12}
        representative_example: stat_panel
    example_classifications:
      pdf_repro_basic_umap: {class: demo, maps_to: {variant: clusters, preset: recommended}}
      basic_umap: {class: legacy_alias, maps_to: {variant: clusters, preset: recommended}}
      group: {class: legacy_alias, maps_to: {variant: clusters, preset: recommended}}
      axis_label_controls: {class: parameter, parameter_group: axes, maps_to: {variant: clusters, preset: recommended}}
      blank_theme: {class: preset, maps_to: {variant: clusters, preset: blank}}
      pdf_basic_umap: {class: export, maps_to: {variant: clusters, preset: publication, export_format: pdf}}
      raster: {class: rendering, maps_to: {variant: clusters, preset: large_dataset, parameters: {rendering_mode: raster}}}
      feature: {class: demo, maps_to: {variant: feature_expression, preset: recommended}}
      pdf_repro_ellipse_mark: {class: demo, maps_to: {variant: ellipse, preset: recommended}}
      ellipse_mark: {class: legacy_alias, maps_to: {variant: ellipse, preset: recommended}}
      mark_shapes: {class: parameter, parameter_group: marks, maps_to: {variant: ellipse, preset: recommended, parameters: {mark_type: ellipse}}}
      pdf_ellipse_mark: {class: export, maps_to: {variant: ellipse, preset: publication, export_format: pdf}}
      pdf_repro_split_samples: {class: demo, maps_to: {variant: split_samples, preset: recommended}}
      split_samples: {class: legacy_alias, maps_to: {variant: split_samples, preset: recommended}}
      split_highlight: {class: variant, maps_to: {variant: split_highlight, preset: recommended}}
      pdf_repro_composition_ring: {class: demo, maps_to: {variant: composition, preset: recommended, parameters: {composition_glyph: ring}}}
      cluster_composition_ring: {class: legacy_alias, maps_to: {variant: composition, preset: recommended, parameters: {composition_glyph: ring}}}
      embedded_pie: {class: legacy_alias, maps_to: {variant: composition, preset: recommended, parameters: {composition_glyph: pie}}}
      pdf_repro_highlight_cells: {class: demo, maps_to: {variant: highlight_cells, preset: recommended}}
      highlight_cells: {class: legacy_alias, maps_to: {variant: highlight_cells, preset: recommended}}
      highlight_ring: {class: legacy_alias, maps_to: {variant: highlight_cells, preset: recommended, parameters: {highlight_style: ring}}}
      pdf_repro_bg_cutoff_mito: {class: demo, maps_to: {variant: background_mask, preset: recommended, parameters: {background_mode: cutoff}}}
      pdf_repro_bg_condition: {class: demo, maps_to: {variant: background_mask, preset: recommended, parameters: {background_mode: category}}}
      background_mask: {class: legacy_alias, maps_to: {variant: background_mask, preset: recommended, parameters: {background_mode: cutoff}}}
      bg_cutoff: {class: legacy_alias, maps_to: {variant: background_mask, preset: recommended, parameters: {background_mode: cutoff}}}
      bg_condition: {class: legacy_alias, maps_to: {variant: background_mask, preset: recommended, parameters: {background_mode: category}}}
      density_filled: {class: legacy_alias, maps_to: {variant: density, preset: recommended, parameters: {density_style: filled}}}
      density_hex: {class: legacy_alias, maps_to: {variant: density, preset: recommended, parameters: {density_style: hexbin}}}
      coexpression: {class: demo, maps_to: {variant: coexpression, preset: recommended, parameters: {color_mix_mode: blend}}}
      coexpression_screen: {class: legacy_alias, maps_to: {variant: coexpression, preset: recommended, parameters: {color_mix_mode: screen}}}
      lineage: {class: demo, maps_to: {variant: lineage, preset: recommended}}
      stat_panel: {class: demo, maps_to: {variant: stat_panel, preset: recommended}}
    legacy_presets:
      basic_umap: {variant: clusters, preset: recommended}
      group: {variant: clusters, preset: recommended}
      axis_label_controls: {variant: clusters, preset: recommended}
      blank_theme: {variant: clusters, preset: blank}
      pdf_basic_umap: {variant: clusters, preset: publication, export_format: pdf}
      raster: {variant: clusters, preset: large_dataset, parameters: {rendering_mode: raster}}
      feature: {variant: feature_expression, preset: recommended}
      ellipse_mark: {variant: ellipse, preset: recommended}
      mark_shapes: {variant: ellipse, preset: recommended, parameters: {mark_type: ellipse}}
      pdf_ellipse_mark: {variant: ellipse, preset: publication, export_format: pdf}
      split_samples: {variant: split_samples, preset: recommended}
      split_highlight: {variant: split_highlight, preset: recommended}
      composition_pie: {variant: composition, preset: recommended, parameters: {composition_glyph: pie}}
      composition_ring: {variant: composition, preset: recommended, parameters: {composition_glyph: ring}}
      cluster_composition_ring: {variant: composition, preset: recommended, parameters: {composition_glyph: ring}}
      embedded_pie: {variant: composition, preset: recommended, parameters: {composition_glyph: pie}}
      highlight_cells: {variant: highlight_cells, preset: recommended}
      highlight_ring: {variant: highlight_cells, preset: recommended, parameters: {highlight_style: ring}}
      background_mask: {variant: background_mask, preset: recommended, parameters: {background_mode: cutoff}}
      bg_cutoff: {variant: background_mask, preset: recommended, parameters: {background_mode: cutoff}}
      bg_condition: {variant: background_mask, preset: recommended, parameters: {background_mode: category}}
      density_filled: {variant: density, preset: recommended, parameters: {density_style: filled}}
      density_hex: {variant: density, preset: recommended, parameters: {density_style: hexbin}}
      coexpression: {variant: coexpression, preset: recommended}
      coexpression_screen: {variant: coexpression, preset: recommended, parameters: {color_mix_mode: screen}}
      lineage: {variant: lineage, preset: recommended}
      stat_panel: {variant: stat_panel, preset: recommended}

  feature_embedding:
    name: Feature embedding
    short_name: Feature plot
    description: Map one or more quantitative features onto a 2D embedding.
    aliases:
      - feature plot
      - featureplot
      - gene umap
      - expression map
      - advFeaPlot
      - single_feature
      - multi_feature
      - split_feature
      - feature_comp
      - density_hex
      - highlight_blank
      - feature density
      - feature density plot
      - expression density
      - scale01
    analysis_contexts: [single_cell, gene_expression]
    tasks: [feature_expression, marker_visualization, density, highlighting]
    data_requirements:
      required_roles: [x_embedding, y_embedding, feature]
      optional_roles: [sample, split, cluster]
    recommendation_rules:
      - when: {has_embedding_xy: true, has_feature: true}
        recommend: {variant: feature_expression, priority: 100}
      - when: {has_embedding_xy: true, has_feature: true, has_sample: true}
        recommend: {variant: split_feature_expression, priority: 80}
    variants:
      - id: feature_expression
        name: Feature Expression
        short_description: Visualize one or more feature values across observations in a 2D embedding.
        description: Map one or more quantitative features onto an existing 2D embedding, as single or multi-panel maps.
        recommended_for: [feature_expression, marker_visualization]
        gallery: {visible: true, section: recommended, order: 1}
        representative_example: pdf_repro_basic_two_features
      - id: split_feature_expression
        name: Split Feature Expression
        short_description: Compare feature maps across samples, conditions, or other groups on the same embedding.
        description: Facet feature expression by a categorical split while retaining embedding context.
        recommended_for: [sample_comparison, feature_expression]
        gallery: {visible: true, section: recommended, order: 2}
        representative_example: pdf_repro_split_by_sample
      - id: feature_coexpression
        name: Feature Coexpression
        short_description: Jointly encode multiple features on one map by mixing their colors.
        description: Blend, multiply, screen, or average per-feature color scales into one coexpression map. This is color mixing, not a numeric product of expression values.
        recommended_for: [feature_expression, gene_expression]
        gallery: {visible: true, section: recommended, order: 3}
        representative_example: pdf_repro_feature_comp_multiply
      - id: aggregated_feature_expression
        name: Aggregated Feature Expression
        short_description: Summarize feature intensity in spatial bins instead of drawing every cell.
        description: Hexagonal bins encode mean feature value per region; optional density contours overlay cell crowding.
        recommended_for: [density, feature_expression]
        gallery: {visible: true, section: more, order: 4}
        representative_example: pdf_repro_hexbin
    example_classifications:
      pdf_repro_basic_two_features: {class: demo, maps_to: {variant: feature_expression, preset: recommended, parameters: {feature_layout: side_by_side}}}
      pdf_repro_multi_feature_scaled: {class: demo, maps_to: {variant: feature_expression, preset: recommended, parameters: {feature_layout: grid, scale_by: feature}}}
      pdf_repro_highlight_cells: {class: demo, maps_to: {variant: feature_expression, preset: recommended, parameters: {highlight_enabled: true}}}
      single_feature: {class: legacy_alias, maps_to: {variant: feature_expression, preset: recommended, parameters: {feature_layout: single}}}
      multi_feature: {class: legacy_alias, maps_to: {variant: feature_expression, preset: recommended, parameters: {feature_layout: grid, scale_by: feature}}}
      highlight_blank: {class: legacy_alias, maps_to: {variant: feature_expression, preset: blank, parameters: {highlight_enabled: true, theme_use: blank}}}
      pdf_repro_split_by_sample: {class: demo, maps_to: {variant: split_feature_expression, preset: recommended, parameters: {global_split: true}}}
      pdf_repro_split_global_blank: {class: preset, maps_to: {variant: split_feature_expression, preset: blank, parameters: {global_split: true, theme_use: blank}}}
      split_feature: {class: legacy_alias, maps_to: {variant: split_feature_expression, preset: recommended, parameters: {global_split: true}}}
      pdf_repro_feature_comp_multiply: {class: demo, maps_to: {variant: feature_coexpression, preset: recommended, parameters: {feature_comp: true, color_mix_mode: multiply}}}
      feature_comp: {class: legacy_alias, maps_to: {variant: feature_coexpression, preset: recommended, parameters: {feature_comp: true, color_mix_mode: blend}}}
      pdf_repro_hexbin: {class: demo, maps_to: {variant: aggregated_feature_expression, preset: recommended, parameters: {aggregation_style: hexbin}}}
      density_hex: {class: legacy_alias, maps_to: {variant: aggregated_feature_expression, preset: recommended, parameters: {aggregation_style: hexbin, show_density: true}}}
    legacy_presets:
      single_feature: {variant: feature_expression, preset: recommended, parameters: {feature_layout: single}}
      multi_feature: {variant: feature_expression, preset: recommended, parameters: {feature_layout: grid, scale_by: feature}}
      highlight_blank: {variant: feature_expression, preset: blank, parameters: {highlight_enabled: true, theme_use: blank}}
      split_feature: {variant: split_feature_expression, preset: recommended, parameters: {global_split: true}}
      split_samples: {variant: split_feature_expression, preset: recommended, parameters: {global_split: true}}
      density_hex: {variant: aggregated_feature_expression, preset: recommended, parameters: {aggregation_style: hexbin, show_density: true}}
      feature_comp: {variant: feature_coexpression, preset: recommended, parameters: {feature_comp: true, color_mix_mode: blend}}
      coexpression: {variant: feature_coexpression, preset: recommended, parameters: {feature_comp: true}}
      highlight_cells: {variant: feature_expression, preset: recommended, parameters: {highlight_enabled: true}}
      density: {variant: aggregated_feature_expression, preset: recommended, parameters: {aggregation_style: hexbin}}
    extra_gallery:
      - id: feature_density
        engine_plugin_id: feature_density_plot
        example_id: basic
        name: Feature Density
        short_description: KNN-smoothed density of one feature across the embedding.
        gallery: {visible: true, section: more, order: 10}
      - id: coexpression_density
        engine_plugin_id: feature_density_plot
        example_id: coexpression
        name: Coexpression Density
        short_description: Combined density of two features on the same embedding.
        gallery: {visible: true, section: more, order: 11}
      - id: scaled_feature_density
        engine_plugin_id: feature_density_plot
        example_id: scale01
        name: Scaled Feature Density
        short_description: Feature density rescaled to a 0–1 color range.
        gallery: {visible: true, section: more, order: 12}

  feature_density_plot:
    status: hidden
    gallery: {visible: false}

  gsea:
    name: GSEA / enrichment running plots
    short_name: GSEA
    description: Ranked-list enrichment curves, summaries, ridges, and gene-pathway diagrams.
    aliases: [gsea, fgsea, running enrichment, enrichment plot, ridgeplot, joyplot, cnet, gene sankey, pathway ridge, nes bubble, gsea heatmap, pathway heatmap]
    analysis_contexts: [functional_enrichment, differential_expression]
    tasks: [gsea, ora, pathway_comparison, gene_pathway_relationship, ranking]
    data_requirements:
      required_roles: [rank]
      optional_roles: [geneset, pvalue, effect, group]
    variants:
      - id: summary
        name: Summary
        description: Bar/lollipop of NES or signed scores.
        recommended_for: [ora, gsea]
      - id: running
        name: Running enrichment
        description: Classic GSEA running-score tracks for one or more terms.
        recommended_for: [gsea]
      - id: multi_group
        name: Multi-group overlay
        description: Independent ES curves per group for one pathway.
        recommended_for: [pathway_comparison]
      - id: ridge
        name: Enrichment ridge
        description: Density of gene log2FC within each enriched term.
        recommended_for: [gsea, distribution]
      - id: gene_sankey
        name: Gene-pathway Sankey
        description: Alluvial gene-to-term links with enrichment bubbles.
        recommended_for: [gene_pathway_relationship]
      - id: dot_summary
        name: Dot summary
        description: Bubble/lollipop summary of NES, count, and FDR.
        recommended_for: [ora]
    example_classifications:
      summary: {class: variant, maps_to: {variant: summary, preset: recommended}}
      running: {class: variant, maps_to: {variant: running, preset: recommended}}
      gradient_curve: {class: variant, maps_to: {variant: running, preset: recommended}}
      image_like: {class: variant, maps_to: {variant: running, preset: publication}}
      multiterm: {class: variant, maps_to: {variant: running, preset: recommended}}
      custom_layout: {class: parameter, parameter_group: layout}
      dot_summary: {class: variant, maps_to: {variant: dot_summary, preset: recommended}}
      multigroup: {class: variant, maps_to: {variant: multi_group, preset: recommended}}
      ridge: {class: variant, maps_to: {variant: ridge, preset: recommended}}
      gene_sankey: {class: variant, maps_to: {variant: gene_sankey, preset: recommended}}
    extra_gallery:
      - id: ridge_nes
        engine_plugin_id: gsea_ridge_nes_plot
        example_id: basic
        name: Pathway Ridge + NES
        short_description: Gene-level log2FC ridges per pathway with a left NES bubble (color and size).
        gallery: {visible: true, section: recommended, order: 1}
      - id: pathway_heatmap
        engine_plugin_id: gsea_pathway_heatmap
        example_id: basic
        name: GSEA + Pathway Heatmap
        short_description: Running-enrichment tracks with per-pathway expression heatmaps. Precomputed NES and sample annotation are optional inputs.
        gallery: {visible: true, section: more, order: 2}
    legacy_presets:
      grouped_curves: {variant: running, preset: recommended}
      classic_tracks: {variant: running, preset: recommended}
      faceted_running: {variant: running, preset: recommended}

  gsea_ridge_nes_plot:
    status: hidden
    gallery: {visible: false}

  grouped_heatmap:
    name: Group heatmap
    aliases: [group heatmap, dotplot, clustered dotplot, clustered heatmap, interactive clustered heatmap]
    analysis_contexts: [single_cell, bulk_expression, gene_expression]
    tasks: [gene_expression, gene_clustering, heatmap, group_comparison, cell_composition]
    data_requirements:
      required_roles: [feature, group]
      optional_roles: [sample, metadata]
    variants:
      - id: heatmap
        name: Heatmap
        short_description: Grouped expression heatmap across clusters or samples.
        gallery: {visible: true, section: more, order: 1}
        representative_example: heatmap
      - id: cell_heatmap
        name: Cell Heatmap
        short_description: Cell-level heatmap of selected features.
        gallery: {visible: true, section: more, order: 2}
        representative_example: cell_heatmap
      - id: dotplot
        name: Dotplot
        short_description: Grouped marker summary with color and size.
        gallery: {visible: true, section: more, order: 3}
        representative_example: dotplot
      - id: clustered_dotplot
        name: Clustered Dotplot
        short_description: Marker dotplot with dendrograms on genes or groups.
        gallery: {visible: true, section: more, order: 4}
        representative_example: clustered_dotplot
    extra_gallery:
      - id: clustered_heatmap
        engine_plugin_id: interactive_clustered_heatmap_plot
        example_id: basic
        name: Clustered Heatmap
        short_description: Cluster rows and columns of a numeric matrix with optional annotations.
        gallery: {visible: true, section: more, order: 20}
      - id: custom_clustered_heatmap
        engine_plugin_id: interactive_clustered_heatmap_plot
        example_id: custom
        name: Custom Annotated Heatmap
        short_description: Annotated clustered heatmap with a custom color scale and cell values.
        gallery: {visible: true, section: more, order: 21}
      - id: interactive_clustered_heatmap
        engine_plugin_id: interactive_clustered_heatmap_plot
        example_id: interactive
        name: Interactive Heatmap
        short_description: Clustered heatmap with hover, zoom, and pan.
        gallery: {visible: true, section: more, order: 22}
      - id: split_panel_heatmap
        engine_plugin_id: interactive_clustered_heatmap_plot
        example_id: panels
        name: Split-Panel Heatmap
        short_description: Clustered heatmap split into column groups such as conditions.
        gallery: {visible: true, section: more, order: 23}
    example_classifications:
      heatmap: {class: demo, maps_to: {variant: heatmap, preset: recommended}}
      cell_heatmap: {class: demo, maps_to: {variant: cell_heatmap, preset: recommended}}
      dotplot: {class: demo, maps_to: {variant: dotplot, preset: recommended}}
      clustered_dotplot: {class: demo, maps_to: {variant: clustered_dotplot, preset: recommended}}
      violin: {class: parameter, parameter_group: marks}

  volcano:
    name: Volcano
    aliases: [volcano plot, differential expression scatter]
    analysis_contexts: [differential_expression]
    tasks: [differential_expression, marker_visualization]
    data_requirements:
      required_roles: [effect, pvalue]
      optional_roles: [feature, group]
    recommendation_rules:
      - when: {has_effect: true, has_pvalue: true}
        recommend: {variant: basic, priority: 100}

  trajectory:
    name: Lineage / trajectory
    aliases: [lineage, pseudotime, trajectory]
    analysis_contexts: [single_cell, trajectory]
    tasks: [trajectory]
    data_requirements:
      required_roles: [x_embedding, y_embedding]
      optional_roles: [cluster]

  venn:
    name: Venn
    aliases: [venn diagram, set overlap]
    analysis_contexts: [relationships_overlap]
    tasks: [overlap]
    extra_gallery:
      - id: venn
        engine_plugin_id: stat_plot
        example_id: venn
        name: Venn
        short_description: Compare overlapping groups from categorical metadata.
        gallery: {visible: true, section: more, order: 20}
  upset:
    name: UpSet
    aliases: [upset plot, set intersections]
    analysis_contexts: [relationships_overlap]
    tasks: [overlap]
    extra_gallery:
