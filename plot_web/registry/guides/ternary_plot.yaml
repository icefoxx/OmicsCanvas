summary: Map three nonnegative components onto a composition simplex.
observation_type: observations or summary items in the input table
best_for:
- Compare three population fractions
- Show three-state score composition
- Find samples dominated by one component
common_uses: []
input_requirements: Three nonnegative columns whose row totals are positive; optional
  groups.
learn_more: 'Input: Three nonnegative columns whose row totals are positive; optional
  groups. Interpretation: Proximity to a vertex indicates a higher relative share
  of that component. Check mappings, order and transformations before adjusting labels,
  colors and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Proximity to a vertex indicates a higher relative share of that component.
cautions:
- id: caution_1
  title: Caution 1
  text: Normalization removes total-quantity information
- id: caution_2
  title: Caution 2
  text: Components must have a defensible common compositional interpretation
examples:
- id: basic
  title: Relative composition of three components
  description: 'Use case: Compare three population fractions. This preset illustrates
    relative composition of three components. Replace its input with your data while
    retaining the appropriate view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare three population fractions
  input_requirements: Three nonnegative columns whose row totals are positive; optional
    groups.
  preview_asset: plugins/ternary_plot/all_examples_gallery/basic.png
  variant_id: basic
  mappings:
    a_column: a
    b_column: b
    c_column: c
    group_column: group
