summary: View supplied three-dimensional coordinates with an interactive scene and
  vector projection.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Three finite numeric coordinate columns and optional categorical
  group; up to 50,000 observations. Coordinates are consumed as supplied, without
  fitting PCA.
best_for:
- Inspect supplied three-dimensional coordinates
- Rotate a grouped sample embedding
- Export a fixed vector projection of the same coordinates
learn_more: Choose the intended data mapping and statistical mode before styling.
  A projection can conceal overlap; rotate the HTML view and compare complementary
  quantitative analyses.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: View supplied three-dimensional coordinates with an interactive scene and
    vector projection. Three finite numeric coordinate columns and optional categorical
    group; up to 50,000 observations. Coordinates are consumed as supplied, without
    fitting PCA.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: A projection can conceal overlap; rotate the HTML view and compare complementary
    quantitative analyses.
- id: caution_2
  title: Interpretation limit 2
  text: The static export uses an orthographic projection; PCA/t-SNE/UMAP fitting
    is performed upstream.
