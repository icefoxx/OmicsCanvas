    group_column: group
literature_ids:
- liu_cellres_2025
reporting:
  base_template: '{family_name}. Report the actual input units, transformations and
    display filters alongside this figure.'
coverage_notes: []
variants:
  bar_only:
    summary: 'Use case: Show scores alongside evidence combinations. This preset illustrates
      metric bars without the matrix. Replace its input with your data while retaining
      the appropriate view settings.'
  heatmap_dots:
    summary: 'Use case: Align outcomes with assay capabilities. This preset illustrates
      continuous evidence matrix. Replace its input with your data while retaining
      the appropriate view settings.'
customization:
- parameter: group_column
  label: Group / color class
  default: group
- parameter: x_column
  label: X category column (bars)
  default: null
- parameter: y_column
  label: Bar value column
  default: auprc
- parameter: group_colors
  label: Group colors {name:#hex}
  default: {}
- parameter: base_size
  label: Base font size
  default: 11
- parameter: width
  label: Width (in)
  default: 7.2
- parameter: height
  label: Height (in)
  default: 5.4
