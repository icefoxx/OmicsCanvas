summary: Link a numeric feature matrix to supplied weighted relationships.
observation_type: supplied measurements, scores or weighted relationships
input_requirements: Long feature/condition/value matrix plus a required links CSV
  with source, target, weight and optional group. Every link source must match a matrix
  feature.
best_for:
- Link molecular measurements to supplied relationships
- Summarize feature-to-drug or feature-to-pathway links
- Compare a matrix and network without recomputing interactions
learn_more: Edges are supplied relationships; the engine does not infer interactions,
  causal links or drug responses.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Link a numeric feature matrix to supplied weighted relationships.
cautions:
- id: caution_0
  title: Interpretation limit
  text: Edges are supplied relationships; the engine does not infer interactions,
    causal links or drug responses.
- id: caution_1
  title: Interpretation limit
  text: Edge width represents absolute weight; edge class colors are supplied separately
    and must be described.
