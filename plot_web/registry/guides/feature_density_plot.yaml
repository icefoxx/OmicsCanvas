learn_more: 'Input: Expression values, observation IDs and their matching embedding
  coordinates. Interpretation: Color represents a density estimate or its rescaling,
  not an individual observation''s raw expression. Check mappings, order and transformations
  before adjusting labels, colors and canvas dimensions. Confirm legends and units
  before export.'
