summary: Cluster matrix columns and display aligned sample annotations.
observation_type: observations or summary items in the input table
best_for:
- Check sample grouping
- Inspect batch structure
- Compare a selected sample subset
common_uses: []
input_requirements: Numeric matrix with row IDs, plus annotations matched to column
  names.
learn_more: 'Input: Numeric matrix with row IDs, plus annotations matched to column
  names. Interpretation: Branches represent hierarchical relationships under the configured
  distance and linkage. Check mappings, order and transformations before adjusting
  labels, colors and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Branches represent hierarchical relationships under the configured distance
    and linkage.
cautions:
- id: caution_1
  title: Caution 1
  text: Scaling and distance affect the hierarchy
- id: caution_2
  title: Caution 2
  text: Branch lengths are not elapsed time or proof of biological classes
examples:
