  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Check sample grouping
  input_requirements: Numeric matrix with row IDs, plus annotations matched to column
    names.
  preview_asset: plugins/den_plot/all_examples_gallery/basic.png
