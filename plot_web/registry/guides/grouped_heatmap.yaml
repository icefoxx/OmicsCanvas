summary: Show multifeature expression patterns as group summaries, cell-level heatmaps
  or dot plots.
observation_type: observations or summary items in the input table
best_for:
- Compare population marker profiles
- Inspect within-group heterogeneity
- Compare expression modules across conditions
common_uses: []
input_requirements: Wide data with group metadata and numeric feature columns.
learn_more: 'Input: Wide data with group metadata and numeric feature columns. Interpretation:
  Heatmap color encodes transformed values; dot views can additionally encode detection
  fractions. Check mappings, order and transformations before adjusting labels, colors
  and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Heatmap color encodes transformed values; dot views can additionally encode
    detection fractions.
cautions:
- id: caution_1
  title: Caution 1
  text: Row scaling shows relative patterns rather than absolute expression
- id: caution_2
  title: Caution 2
  text: Group averages depend on sample composition
examples:
- id: heatmap
  title: Group-mean expression modules
  description: 'Use case: Compare population marker profiles. This preset illustrates
    group-mean expression modules. Replace its input with your data while retaining
    the appropriate view settings.'
  demo_id: heatmap
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare population marker profiles
  input_requirements: Wide data with group metadata and numeric feature columns.
  preview_asset: plugins/group_heatmap/all_examples_gallery/heatmap.png
  variant_id: heatmap
  mappings:
    id_column: cell
    group_column: cluster
    cluster_columns: false
- id: cell_heatmap
  title: Observation-level expression heterogeneity
  description: 'Use case: Inspect within-group heterogeneity. This preset illustrates
    observation-level expression heterogeneity. Replace its input with your data while
    retaining the appropriate view settings.'
  demo_id: cell_heatmap
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Inspect within-group heterogeneity
  input_requirements: Wide data with group metadata and numeric feature columns.
  preview_asset: plugins/group_heatmap/all_examples_gallery/cell_heatmap.png
  variant_id: cell_heatmap
  mappings:
    id_column: cell
    group_column: cluster
    cluster_columns: false
- id: dotplot
  title: Expression and detection fractions
  description: 'Use case: Compare expression modules across conditions. This preset
    illustrates expression and detection fractions. Replace its input with your data
    while retaining the appropriate view settings.'
  demo_id: dotplot
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare expression modules across conditions
  input_requirements: Wide data with group metadata and numeric feature columns.
  preview_asset: plugins/group_heatmap/all_examples_gallery/dotplot.png
  variant_id: dotplot
  mappings:
    id_column: cell
    group_column: cluster
literature_ids:
- eisen_clustering_1998
- hao_dnt_2026
- yang_projection_2025
reporting:
  base_template: '{family_name}. Report the actual input units, transformations and
    display filters alongside this figure.'
coverage_notes: []
variants:
  heatmap:
    summary: Grouped expression heatmap across clusters or samples.
  cell_heatmap:
    summary: Cell-level heatmap of selected features.
  dotplot:
    summary: Grouped marker summary with color and size.
  clustered_dotplot:
    summary: Marker dotplot with dendrograms on genes or groups.
customization: []
