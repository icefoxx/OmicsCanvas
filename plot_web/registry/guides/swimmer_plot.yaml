summary: Show observation intervals and dated events for individual subjects.
observation_type: observations or supplied summaries described in the input contract
input_requirements: One unique subject per start/end interval with end >= start. Optional
  events CSV has subject, time and event; events must fall within their subject interval.
best_for:
- Summarize individual follow-up intervals
- Overlay dated treatment or response events
- Compare staggered observation windows
learn_more: Choose the intended data mapping and statistical mode before styling.
  An interval endpoint marker does not identify progression, death or censoring unless
  the event table explicitly encodes it.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Show observation intervals and dated events for individual subjects. One unique
    subject per start/end interval with end >= start. Optional events CSV has subject,
    time and event; events must fall within their subject interval.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: An interval endpoint marker does not identify progression, death or censoring
    unless the event table explicitly encodes it.
- id: caution_2
  title: Interpretation limit 2
  text: Intervals are supplied observations; no treatment effect or survival model
    is inferred.
