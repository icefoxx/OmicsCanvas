summary: Display a supplied two-dimensional grid of counts as projected three-dimensional
  bars.
observation_type: observations or supplied summaries described in the input contract
input_requirements: One nonnegative count per X/Y/group grid cell. X and Y are supplied
  categorical grid positions. Limit each axis to 15 positions.
best_for:
- Show two-way mutation-context count grids
- Compare height profiles across panels
- Inspect a precomputed grid using a fixed projection
learn_more: Choose the intended data mapping and statistical mode before styling.
  Perspective obscures some bars. A heatmap or ordinary bar plot may support more
  accurate comparisons.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Display a supplied two-dimensional grid of counts as projected three-dimensional
    bars. One nonnegative count per X/Y/group grid cell. X and Y are supplied categorical
    grid positions. Limit each axis to 15 positions.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Perspective obscures some bars. A heatmap or ordinary bar plot may support
    more accurate comparisons.
- id: caution_2
  title: Interpretation limit 2
  text: Free panel height scaling is explicit and prevents direct height comparisons
    between panels.
