summary: Display genomic association probabilities and their expected-quantile comparison.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Raw probabilities in (0,1], plus chromosome and nonnegative genomic
  position for Manhattan views. Optional nonempty labels identify selected loci.
best_for:
- Locate genomic association signals
- Check the distribution of supplied association probabilities
- Label selected loci without changing significance thresholds
learn_more: Choose the intended data mapping and statistical mode before styling.
  Rounded zero probabilities are rejected rather than silently floored. Select a justified
  detection bound upstream.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Display genomic association probabilities and their expected-quantile comparison.
    Raw probabilities in (0,1], plus chromosome and nonnegative genomic position for
    Manhattan views. Optional nonempty labels identify selected loci.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Rounded zero probabilities are rejected rather than silently floored. Select
    a justified detection bound upstream.
- id: caution_2
  title: Interpretation limit 2
  text: A QQ deviation alone does not identify population structure or establish biological
    significance.
