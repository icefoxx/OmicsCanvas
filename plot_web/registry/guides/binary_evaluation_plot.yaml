summary: ROC, precision–recall, calibration and decision curves from supplied predictions.
observation_type: observations or supplied summaries described in the input contract
input_requirements: 'Predictions mode: binary outcome, numeric score and optional
  model/group. Calibration and decision curves require probabilities in [0,1]. Curve
  mode: supplied numeric x/y and optional group.'
best_for:
- Compare supplied binary-model predictions
- Inspect probability calibration
- Compare net benefit over declared decision thresholds
learn_more: Choose the intended data mapping and statistical mode before styling.
  No model training, optimism correction or clinical threshold selection is performed.
  Evaluate held-out predictions where appropriate.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: 'ROC, precision–recall, calibration and decision curves from supplied predictions.
    Predictions mode: binary outcome, numeric score and optional model/group. Calibration
    and decision curves require probabilities in [0,1]. Curve mode: supplied numeric
    x/y and optional group.'
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: No model training, optimism correction or clinical threshold selection is
    performed. Evaluate held-out predictions where appropriate.
- id: caution_2
  title: Interpretation limit 2
  text: Ordinary binary evaluation does not handle censored outcomes. Upload externally
    computed curves for time-dependent ROC.
