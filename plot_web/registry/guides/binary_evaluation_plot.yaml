literature_ids:
- figureya_lu_2025
coverage_notes:
- The reference collection is linked as a methodology source. Local demos use independently
  generated data and are not reproductions of its analyses.
- Additional verified published figure/panel examples remain to be curated.
customization:
- parameter: outcome_column
  label: Outcome column
  default: outcome
  help: ''
- parameter: score_column
  label: Score column
  default: score
  help: ''
- parameter: group_column
  label: Group column
  default: group
  help: ''
- parameter: x_column
  label: X column
  default: x
  help: X/Y are used only for input_mode = curve.
- parameter: y_column
  label: Y column
  default: y
  help: X/Y are used only for input_mode = curve.
- parameter: input_mode
  label: Input mode
  default: predictions
  help: Supplied curve coordinates support upstream time-dependent analyses without
    fitting censoring models here.
- parameter: plot_type
  label: Plot type
  default: roc
  help: ''
- parameter: positive_class
  label: Positive class
  default: ''
  help: Empty uses the observed label 1; otherwise enter the positive outcome label.
    Predictions mode only.
- parameter: calibration_bins
  label: Calibration bins
  default: 8
  help: Equal-width probability bins; calibration predictions mode only.
- parameter: threshold_min
  label: Threshold min
  default: 0.01
  help: Decision-curve predictions mode only; min must remain below max.
- parameter: threshold_max
  label: Threshold max
  default: 0.8
  help: Decision-curve predictions mode only; min must remain below max.
- parameter: point_size
  label: Point size
  default: 2
  help: Only for calibration plots.
- parameter: line_width
  label: Line width
  default: 0.6
  help: ''
- parameter: palette
  label: Palette
  default: Set 2
  help: ''
- parameter: group_colors
  label: Named colors
  default: {}
  help: Named categorical colors override the palette.
- parameter: title
  label: Title
  default: ''
  help: ''
- parameter: subtitle
  label: Subtitle
  default: ''
  help: Empty uses the automatic description.
- parameter: caption
  label: Caption
  default: ''
  help: ''
- parameter: title_size
  label: Title size
  default: 13
  help: Only when a nonempty title is supplied.
- parameter: legend_show
  label: Legend show
  default: true
  help: ''
- parameter: legend_position
  label: Legend position
  default: right
  help: ''
- parameter: legend_text_size
  label: Legend text size
  default: 9
  help: ''
- parameter: metric_show
  label: Show AUC / AP / Brier in legend
  default: true
  help: Predictions mode only; applies to ROC, precision–recall and calibration.
- parameter: font_family
  label: Font family
  default: sans
  help: ''
- parameter: base_size
  label: Base size
  default: 11
  help: ''
- parameter: plot_background
  label: Plot background
  default: '#FFFFFF'
  help: ''
- parameter: grid_show
  label: Grid show
  default: false
  help: ''
- parameter: width
  label: Width
  default: 8
  help: Inches.
- parameter: height
  label: Height
  default: 6
  help: Inches.
- parameter: dpi
  label: Dpi
  default: 150
  help: ''
- parameter: x_limits
  label: X limits
  default: []
  help: Optional two-number display limits; empty = automatic. Data outside the viewport
    remain exported.
- parameter: y_limits
  label: Y limits
  default: []
  help: Optional two-number display limits; empty = automatic. Data outside the viewport
    remain exported.
reporting:
  base_template: '{family_name}. Report input mappings, units, preprocessing and all
    selected statistical or display modes.'
