  input_requirements: Method names, numeric metric columns and score columns, or supported
    long-format data.
  preview_asset: plugins/interactive_bubble_score_matrix/all_examples_gallery/multi_score.png
  variant_id: multi_score
  mappings:
    row_column: method
    metric_columns:
    - ARI
    - NMI
    - F1
    - ASW
    - V-Measure Homogeneity
    score_columns:
    - Bio(CP)
    - DBI
    - Overall
- id: custom
  title: Customized matrix-panel alignment
  description: 'Use case: Inspect ranking trade-offs. This preset illustrates customized
