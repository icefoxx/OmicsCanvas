summary: Show supplied nested clone fractions across time.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Long table of clone, parent (0 for virtual root), time and inclusive
  clone fraction. Child fractions may not exceed their parent; root fractions may
  not sum above one.
best_for:
- Summarize nested clone fractions over time
- Show expanding and disappearing subclones
- Display supplied parent relationships without inferring ancestry
learn_more: Choose the intended data mapping and statistical mode before styling.
  Parent fractions include descendants. Do not sum nested parents and children as
  independent populations.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Show supplied nested clone fractions across time. Long table of clone, parent
    (0 for virtual root), time and inclusive clone fraction. Child fractions may not
    exceed their parent; root fractions may not sum above one.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Parent fractions include descendants. Do not sum nested parents and children
    as independent populations.
- id: caution_2
  title: Interpretation limit 2
  text: Parent relationships are supplied, not inferred; linear interpolation between
    time points does not establish clone dynamics.
