summary: Color supplied anatomical or tissue-region polygons by numeric measurements.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Ordered x/y polygon vertices, region ID and one numeric value
  per region; optional part IDs for multipart polygons. PNG overlays require top-left-origin
  image pixel coordinates and invert_y.
best_for:
- Map region-level expression measurements
- Color supplied anatomical polygons
- Overlay supplied regions on a synthetic or uploaded PNG tissue image
learn_more: Choose the intended data mapping and statistical mode before styling.
  Geometry is supplied; the plugin does not segment tissue or provide a built-in anatomical
  atlas.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Color supplied anatomical or tissue-region polygons by numeric measurements.
    Ordered x/y polygon vertices, region ID and one numeric value per region; optional
    part IDs for multipart polygons. PNG overlays require top-left-origin image pixel
    coordinates and invert_y.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Geometry is supplied; the plugin does not segment tissue or provide a built-in
    anatomical atlas.
- id: caution_2
  title: Interpretation limit 2
  text: PNG overlays require matched pixel coordinates. Polygon labels are approximate
    and should be visually checked for concave regions.
- type: caution
  title: Geometry and inference
  text: Choose polygon geometry for ordered boundary vertices or spot geometry for
    independent measured coordinates. Spot size applies only to spots. Optional PNG
    backgrounds use pixel coordinates and require an inverted y axis.
