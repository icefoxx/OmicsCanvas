- hao_dnt_2026
- li_cerebrum_2021
- jing_auditory_2025
reporting:
  base_template: '{family_name}. Report the actual input units, transformations and
    display filters alongside this figure.'
coverage_notes: []
variants:
  basic:
    summary: Hierarchy, cell counts, and marker dot matrix.
  CAB_demo:
    summary: Reference-style hierarchical marker panel.
  sample_percent:
    summary: 'Use case: Check marker evidence alongside abundance. This preset illustrates
      sample composition fractions. Replace its input with your data while retaining
      the appropriate view settings.'
