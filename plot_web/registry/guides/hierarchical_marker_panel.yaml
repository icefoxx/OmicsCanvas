customization:
- parameter: base_size
  label: Base font size
  default: 11
- parameter: width
  label: Width (in)
  default: 10
  help: Used when auto_width is false; automatic mode derives the main width from
    cell type count.
- parameter: height
  label: Height (in)
  default: 7
  help: Used when auto_height is false; automatic mode derives height from marker
    count.
