summary: Show multiple alteration types per gene and sample with marginal frequencies.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Long table of gene, sample and alteration type. Multiple rows
  per gene/sample represent distinct types. None/WT marks no supplied alteration;
  all evaluated samples must be present.
best_for:
- Summarize mutation and copy-number alterations
- Identify samples with multiple alteration types
- Compare altered-sample frequencies across genes
learn_more: Choose the intended data mapping and statistical mode before styling.
  Missing input coverage is not evidence of wild type. Include every evaluated sample,
  including explicit no-alteration entries.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Show multiple alteration types per gene and sample with marginal frequencies.
    Long table of gene, sample and alteration type. Multiple rows per gene/sample
    represent distinct types. None/WT marks no supplied alteration; all evaluated
    samples must be present.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Missing input coverage is not evidence of wild type. Include every evaluated
    sample, including explicit no-alteration entries.
- id: caution_2
  title: Interpretation limit 2
  text: Multiple alteration types share a cell; slice height does not encode allele
    fraction or variant count.
examples:
- id: basic
  title: Multi-hit alteration matrix
  description: Summarize mutation and copy-number alterations
  scenario: Summarize mutation and copy-number alterations
  demo_id: basic
  variant_id: basic
  preview_asset: plugins/oncoprint_plot/all_examples_gallery/basic.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    feature_column: gene
    sample_column: sample
    group_column: alteration
- id: input_order
  title: Input-order alteration matrix
  description: Identify samples with multiple alteration types
  scenario: Identify samples with multiple alteration types
  demo_id: input_order
