summary: Rank categories with one bar per item, colored by its class.
observation_type: observations or summary items in the input table
best_for:
- Rank enrichment terms by class
- Compare feature scores
- Highlight a functional category
common_uses: []
input_requirements: Category labels, numeric values and a class/type column.
learn_more: 'Input: Category labels, numeric values and a class/type column. Interpretation:
  Bar length encodes the value and color identifies the class. Check mappings, order
  and transformations before adjusting labels, colors and canvas dimensions. Confirm
  legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Bar length encodes the value and color identifies the class.
cautions:
- id: caution_1
  title: Caution 1
  text: Classes are annotations rather than extra numeric series
- id: caution_2
  title: Caution 2
  text: Sorting and top-N filters change the displayed universe
examples:
- id: basic
  title: Category score overview
  description: 'Use case: Rank enrichment terms by class. This preset illustrates
    category score overview. Replace its input with your data while retaining the
    appropriate view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Rank enrichment terms by class
  input_requirements: Category labels, numeric values and a class/type column.
  preview_asset: plugins/classified_bar_plot/all_examples_gallery/basic.png
  mappings:
    category_column: category
    type_column: type
    value_column: value
- id: vertical
  title: Vertical category comparison
  description: 'Use case: Compare feature scores. This preset illustrates vertical
    category comparison. Replace its input with your data while retaining the appropriate
    view settings.'
  demo_id: vertical
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare feature scores
  input_requirements: Category labels, numeric values and a class/type column.
  preview_asset: plugins/classified_bar_plot/all_examples_gallery/vertical.png
  variant_id: vertical
  mappings:
    category_column: category
    type_column: type
    value_column: value
- id: labeled
  title: Rankings with numeric labels
  description: 'Use case: Highlight a functional category. This preset illustrates
    rankings with numeric labels. Replace its input with your data while retaining
    the appropriate view settings.'
  demo_id: labeled
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Highlight a functional category
  input_requirements: Category labels, numeric values and a class/type column.
  preview_asset: plugins/classified_bar_plot/all_examples_gallery/labeled.png
  mappings:
    category_column: category
    type_column: type
    value_column: value
literature_ids:
- hao_dnt_2026
- liu_cellres_2025
- sanchez_wheat_2025
reporting:
  base_template: '{family_name}. Report the actual input units, transformations and
    display filters alongside this figure.'
coverage_notes: []
variants:
  cab_demo:
    summary: Default horizontal classified bars.
  vertical:
    summary: Same classified bars in vertical orientation.
customization:
- parameter: value_column
  label: Value column
  default: null
- parameter: category_column
  label: Category / label column
  default: null
- parameter: sort_by
  label: Sort bars by
  default: input
- parameter: palette
  label: Named palette
  default: ''
- parameter: width
  label: Export width (in)
  default: 8
- parameter: height
  label: Export height (in)
  default: 7
