    x_column: UMAP_1
    y_column: UMAP_2
    cluster_column: subtype
    group_column: subclass
- id: similarity
  title: Feature-based relationships
  description: Compare subtype feature profiles independently of the embedding
  demo_id: similarity
  variant_id: similarity
  scenario: Compare subtype feature profiles independently of the embedding
  data_note: Independent synthetic cell data, not the original reference image or
