summary: Link a radial cell-type hierarchy to a central embedding with matching annotation
  colors.
observation_type: single cells with supplied two-dimensional coordinates and a unique
  annotation hierarchy
best_for:
- Summarize a cell atlas at multiple annotation levels
- Compare known taxonomy with feature-based cluster similarity
- Switch center colors between broad classes and fine subtypes
input_requirements: One cell table with numeric embedding X/Y, a leaf subtype, and
  ordered categorical hierarchy columns. Similarity mode additionally requires at
  least two finite numeric feature columns.
learn_more: The outer rings describe annotation paths and the center shows the supplied
  embedding. Choose annotation mode for known taxonomy or similarity mode to cluster
  per-leaf mean feature profiles. Angular placement is independent of UMAP position;
  match labels and colors instead of interpreting angle as a coordinate.
interpretation:
- id: topology
  title: Tree construction
  type: direct
  text: Annotation mode shows supplied parent-child relationships with equal depth
    per level. Similarity mode uses Euclidean distances on mean feature profiles,
    optionally standardized across leaves.
- id: colors
  title: Matched annotations
  type: direct
  text: The center color annotation must belong to the ring hierarchy. Select class,
    subclass or subtype and use the same named color overrides throughout.
cautions:
- id: distance
  title: Embedding and tree distances
  text: No UMAP/t-SNE or lineage inference is performed. Do not interpret global embedding
    distances as calibrated similarity, or annotation branch lengths as biological
    distances.
- id: area
  title: Areas and angles
  text: Circular slots are equal per leaf, not proportional to cell abundance. Hulls
    are descriptive convex envelopes, not density contours or confidence intervals.
- id: hierarchy
  title: Unique paths
  text: Each child label and leaf must have one unique parent path. Similarity order
    may split a category into multiple separate ring arcs.
