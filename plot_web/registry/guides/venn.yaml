  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare differential-gene lists
  input_requirements: Element IDs and set membership, or an abundance table in the
    supported layout.
  preview_asset: plugins/dynamic_venn_diagram/all_examples_gallery/abundance.png
  variant_id: abundance
  mappings:
    element_id_column: OTU
- id: params
  title: Explicit set definitions and overlaps
