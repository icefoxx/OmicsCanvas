summary: Display overlaps among a small number of sets, including sets derived from
  abundance data.
observation_type: observations or summary items in the input table
best_for:
- Compare differential-gene lists
- Find shared and unique sample members
- Inspect overlaps after thresholding
common_uses: []
input_requirements: Element IDs and set membership, or an abundance table in the supported
  layout.
learn_more: 'Input: Element IDs and set membership, or an abundance table in the supported
  layout. Interpretation: Region labels give the counts for the corresponding set
  intersections. Check mappings, order and transformations before adjusting labels,
  colors and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Region labels give the counts for the corresponding set intersections.
cautions:
- id: caution_1
  title: Caution 1
  text: Region area need not be proportional to the count
- id: caution_2
  title: Caution 2
  text: Use an intersection matrix when there are many sets
examples:
- id: abundance
  title: Sets from abundance data
  description: 'Use case: Compare differential-gene lists. This preset illustrates
    sets from abundance data. Replace its input with your data while retaining the
    appropriate view settings.'
