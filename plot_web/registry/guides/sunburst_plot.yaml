    retaining the appropriate view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Summarize annotation hierarchy composition
  input_requirements: Parent, child, optional third-level labels and nonnegative values.
  preview_asset: plugins/sunburst_plot/all_examples_gallery/basic.png
