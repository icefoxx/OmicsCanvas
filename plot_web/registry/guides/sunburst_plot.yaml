summary: Show two- or three-level category composition using nested sectors.
observation_type: observations or summary items in the input table
best_for:
- Summarize annotation hierarchy composition
- Survey functional classifications
- Inspect shares within parent categories
common_uses: []
input_requirements: Parent, child, optional third-level labels and nonnegative values.
learn_more: 'Input: Parent, child, optional third-level labels and nonnegative values.
  Interpretation: Children nest inside parents and sector angles represent the corresponding
  values. Check mappings, order and transformations before adjusting labels, colors
  and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Children nest inside parents and sector angles represent the corresponding
    values.
cautions:
- id: caution_1
  title: Caution 1
  text: Preserve full paths when child labels repeat
- id: caution_2
  title: Caution 2
  text: Outer-ring area does not imply greater quantity
examples:
