summary: Compare paired measurements using mean differences and limits of agreement.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Paired finite numeric measurements in the same units, one independent
  pair per row, with optional group. Percent differences require nonzero pair means.
best_for:
- Compare two measurement methods
- Inspect systematic measurement bias
- Inspect proportional differences across measurement ranges
learn_more: Choose the intended data mapping and statistical mode before styling.
  Agreement limits assume independent, approximately normal differences; repeated
  measurements require a different model.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Compare paired measurements using mean differences and limits of agreement.
    Paired finite numeric measurements in the same units, one independent pair per
    row, with optional group. Percent differences require nonzero pair means.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Agreement limits assume independent, approximately normal differences; repeated
    measurements require a different model.
- id: caution_2
  title: Interpretation limit 2
  text: The difference direction is method A minus method B. Percent differences use
    the mean of the pair as denominator.
