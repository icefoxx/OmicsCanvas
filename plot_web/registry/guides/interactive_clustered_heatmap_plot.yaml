summary: Cluster a numeric matrix with aligned row/column annotations and optional
  side panels.
observation_type: observations or summary items in the input table
best_for:
- Find sample and feature modules
- Check batch and biological groups
- Compare aligned ancillary metrics
common_uses: []
input_requirements: Wide numeric matrix with row IDs; optional matched row and column
  annotations.
learn_more: 'Input: Wide numeric matrix with row IDs; optional matched row and column
  annotations. Interpretation: Tiles show the configured values or scaling; trees
  describe the selected distances. Check mappings, order and transformations before
  adjusting labels, colors and canvas dimensions. Confirm legends and units before
  export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Tiles show the configured values or scaling; trees describe the selected distances.
cautions:
- id: caution_1
  title: Caution 1
  text: Missing-value handling and scaling affect clustering
- id: caution_2
  title: Caution 2
  text: Co-varying modules do not establish shared regulation
examples:
