summary: Compare numeric score distributions and highlighted observations on concentric
  arcs.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Numeric score, metric name, group and optional observation ID.
  Highlight IDs select existing observations. Angle represents value, not frequency.
best_for:
- Compare a target score with reference distributions
- Show cohort distributions on concentric arcs
- Compare several numeric score metrics
learn_more: Choose the intended data mapping and statistical mode before styling.
  Angle encodes the supplied numeric score, not rank unless ranks were uploaded as
  values.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Compare numeric score distributions and highlighted observations on concentric
    arcs. Numeric score, metric name, group and optional observation ID. Highlight
    IDs select existing observations. Angle represents value, not frequency.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Angle encodes the supplied numeric score, not rank unless ranks were uploaded
    as values.
- id: caution_2
  title: Interpretation limit 2
  text: Separate ring groups do not encode population size by ring area. Free metric
    ranges prevent direct angular comparison across panels.
