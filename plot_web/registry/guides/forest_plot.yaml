summary: Compare supplied effect estimates and confidence intervals.
observation_type: observations or supplied summaries described in the input contract
input_requirements: 'One row per effect: unique label, estimate, lower/upper interval
  bounds and optional group. Log axes require positive estimates/bounds and a positive
  null value.'
best_for:
- Compare effect estimates across cohorts
- Summarize subgroup confidence intervals
- Display supplied ratio estimates on a logarithmic axis
learn_more: Choose the intended data mapping and statistical mode before styling.
  Confidence intervals and effect units are supplied, not estimated. Ratio estimates
  and signed differences use different reference values.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: 'Compare supplied effect estimates and confidence intervals. One row per effect:
    unique label, estimate, lower/upper interval bounds and optional group. Log axes
    require positive estimates/bounds and a positive null value.'
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Confidence intervals and effect units are supplied, not estimated. Ratio estimates
    and signed differences use different reference values.
- id: caution_2
  title: Interpretation limit 2
  text: A forest display does not fit a random-effects meta-analysis or establish
    subgroup interactions.
examples:
