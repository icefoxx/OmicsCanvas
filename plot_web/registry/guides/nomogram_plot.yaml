summary: Display supplied predictor point scales and total-point outcome mappings.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Supplied scale name, normalized tick position in [0,1] and display
  label. Predictor-to-point and outcome mappings must be derived upstream from a fitted
  model.
best_for:
- Publish supplied predictor point scales
- Display total-point to outcome mappings
- Assemble a model-derived scale layout without refitting the model
learn_more: Choose the intended data mapping and statistical mode before styling.
  The plugin draws supplied scales and does not fit, validate or calibrate a prediction
  model.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Display supplied predictor point scales and total-point outcome mappings.
    Supplied scale name, normalized tick position in [0,1] and display label. Predictor-to-point
    and outcome mappings must be derived upstream from a fitted model.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: The plugin draws supplied scales and does not fit, validate or calibrate a
    prediction model.
- id: caution_2
  title: Interpretation limit 2
  text: Normalized positions are layout coordinates. Patient risk cannot be calculated
    from an arbitrary scale drawing.
