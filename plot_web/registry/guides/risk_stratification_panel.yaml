summary: Align supplied risk ranks, event follow-up and selected numeric features.
observation_type: supplied measurements, scores or weighted relationships
input_requirements: One row per unique subject with supplied risk_score, nonnegative
  follow-up time, event 0/1 and optional group. Optional numeric feature_columns form
  the aligned heatmap.
best_for:
- Inspect supplied scores in risk order
- Align event follow-up with subject scores
- Compare selected feature profiles across the same ranked subjects
learn_more: Risk scores and groups are supplied. No survival model, optimal cutoff
  or group assignment is inferred.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Align supplied risk ranks, event follow-up and selected numeric features.
cautions:
- id: caution_0
  title: Interpretation limit
  text: Risk scores and groups are supplied. No survival model, optimal cutoff or
    group assignment is inferred.
- id: caution_1
  title: Interpretation limit
  text: Displayed follow-up points are not survival estimates. Per-feature Z-scores
    are a display transform, not a differential-expression test.
examples:
- id: basic
  title: Aligned risk and follow-up
  description: Inspect supplied scores in risk order
  scenario: Inspect supplied scores in risk order
  demo_id: basic
  variant_id: basic
  preview_asset: plugins/risk_stratification_panel/all_examples_gallery/basic.png
  data_note: Independent synthetic demonstration, not original publication data.
- id: scores_only
  title: Scores and follow-up
  description: Align event follow-up with subject scores
  scenario: Align event follow-up with subject scores
  demo_id: scores_only
  variant_id: scores_only
