summary: Project nonnegative feature weights toward labeled vertices of a wheel.
observation_type: observations or supplied summaries described in the input contract
input_requirements: 3–12 numeric feature columns in desired vertex order, plus optional
  group. Row-sum mode requires nonnegative weights. Zero-total rows are reported and
  omitted.
best_for:
- Summarize nonnegative program weights
- Compare observations against multiple feature vertices
- Inspect an explicitly chosen feature normalization
learn_more: Choose the intended data mapping and statistical mode before styling.
  Vertex order and normalization affect the projection; record both. Nearby observations
  need not have identical profiles.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Project nonnegative feature weights toward labeled vertices of a wheel. 3–12
    numeric feature columns in desired vertex order, plus optional group. Row-sum
    mode requires nonnegative weights. Zero-total rows are reported and omitted.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Vertex order and normalization affect the projection; record both. Nearby
    observations need not have identical profiles.
- id: caution_2
  title: Interpretation limit 2
  text: Negative feature values require explicit feature-minmax normalization; no
    trajectory is inferred.
