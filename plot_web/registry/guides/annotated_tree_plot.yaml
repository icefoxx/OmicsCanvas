summary: Draw a supplied weighted tree with leaf metadata or a linked feature heatmap.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Connected acyclic rooted edge table with parent, child and nonnegative
  length. Optional size/group fields and a node-keyed annotation table of numeric
  feature columns.
best_for:
- Inspect a supplied weighted tree
- Link terminal leaves to numeric feature annotations
- Show weighted nodes in a circular tree
learn_more: Choose the intended data mapping and statistical mode before styling.
  The tree and branch lengths are supplied. No phylogenetic reconstruction or cluster
  similarity is inferred.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Draw a supplied weighted tree with leaf metadata or a linked feature heatmap.
    Connected acyclic rooted edge table with parent, child and nonnegative length.
    Optional size/group fields and a node-keyed annotation table of numeric feature
    columns.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: The tree and branch lengths are supplied. No phylogenetic reconstruction or
    cluster similarity is inferred.
- id: caution_2
  title: Interpretation limit 2
  text: Heatmap rows must match terminal leaves. A circular layout does not imply
    circular evolutionary distances.
examples:
- id: basic
  title: Supplied tree and feature heatmap
  description: Inspect a supplied weighted tree
  scenario: Inspect a supplied weighted tree
  demo_id: basic
  variant_id: basic
  preview_asset: plugins/annotated_tree_plot/all_examples_gallery/basic.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    parent_column: parent
    child_column: child
    length_column: length
    group_column: group
    size_column: size
- id: circular
  title: Circular tree with weighted nodes
  description: Link terminal leaves to numeric feature annotations
  scenario: Link terminal leaves to numeric feature annotations
  demo_id: circular
  variant_id: circular
  preview_asset: plugins/annotated_tree_plot/all_examples_gallery/circular.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    parent_column: parent
    child_column: child
    length_column: length
    group_column: group
    size_column: size
