summary: Show nonnegative category shares using pie or donut sectors.
observation_type: observations or summary items in the input table
best_for:
- Summarize a few cell-type shares
- Survey sample composition
- Check category order and labels
common_uses: []
input_requirements: Categories and nonnegative values, with optional groups, labels
  or colors.
learn_more: 'Input: Categories and nonnegative values, with optional groups, labels
  or colors. Interpretation: Sector angles encode shares of the displayed total. Check
  mappings, order and transformations before adjusting labels, colors and canvas dimensions.
  Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Sector angles encode shares of the displayed total.
cautions:
- id: caution_1
  title: Caution 1
  text: Filtering and top-N selection can change the denominator
- id: caution_2
  title: Caution 2
  text: Use stacked bars for clearer comparisons across many samples
