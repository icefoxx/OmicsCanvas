summary: Plot differential effects against statistical evidence, with configurable
  regions and highlights.
observation_type: observations or summary items in the input table
best_for:
- Find large well-supported changes
- Compare upregulated and downregulated features
- Explain differential-selection thresholds
common_uses: []
input_requirements: Upstream differential-analysis results containing features, effects
  and raw or adjusted probabilities.
learn_more: 'Input: Upstream differential-analysis results containing features, effects
  and raw or adjusted probabilities. Interpretation: The x-axis shows an effect; the
  y-axis generally shows a negative-log probability, as labelled. Check mappings,
  order and transformations before adjusting labels, colors and canvas dimensions.
  Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: The x-axis shows an effect; the y-axis generally shows a negative-log probability,
    as labelled.
cautions:
- id: caution_1
  title: Caution 1
  text: State the contrast direction and whether probabilities are adjusted
- id: caution_2
  title: Caution 2
  text: Display filters cannot replace an appropriate replicate design and model
