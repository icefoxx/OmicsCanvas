summary: Summarize a numeric matrix with sized bubbles and optional marginal statistics.
observation_type: observations or summary items in the input table
best_for:
- Compare sample-feature intensities
- Inspect cross-category counts
- Check row and column summaries
common_uses: []
input_requirements: A row identifier and numeric matrix, or supported long-format
  column mappings.
learn_more: 'Input: A row identifier and numeric matrix, or supported long-format
  column mappings. Interpretation: Bubble size encodes values; gradient mode also
  uses color for intensity. Check mappings, order and transformations before adjusting
  labels, colors and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Bubble size encodes values; gradient mode also uses color for intensity.
cautions:
- id: caution_1
  title: Caution 1
  text: Read the size legend rather than estimating ratios from diameters
- id: caution_2
  title: Caution 2
  text: Marginal statistics depend on the selected rows, columns and aggregation
