summary: Overlay supplied displacement vectors on an embedding without inferring velocities.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Finite numeric x/y coordinates, supplied vx/vy vectors in compatible
  coordinate units, and optional group.
best_for:
- Visualize supplied displacement vectors
- Inspect directions on an existing embedding
- Compare a vector field without running velocity inference
learn_more: Choose the intended data mapping and statistical mode before styling.
  The plugin does not compute RNA velocity or a kinetic model. Supply vector coordinates
  compatible with the embedding.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Overlay supplied displacement vectors on an embedding without inferring velocities.
    Finite numeric x/y coordinates, supplied vx/vy vectors in compatible coordinate
    units, and optional group.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: The plugin does not compute RNA velocity or a kinetic model. Supply vector
    coordinates compatible with the embedding.
- id: caution_2
  title: Interpretation limit 2
  text: Arrow thinning uses a deterministic row stride and does not estimate a spatial
    average or streamline.
