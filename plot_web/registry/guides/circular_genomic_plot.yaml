summary: Arrange supplied genomic intervals, values and optional links on a circular
  genome.
observation_type: observations or supplied summaries described in the input contract
input_requirements: 'Intervals: chromosome, start, end, value and optional track.
  Coordinates are 0-based, half-open. Optional chromosome/length and source_chr/source_pos/target_chr/target_pos
  link tables.'
best_for:
- Compare supplied genomic interval tracks
- Show chromosome-spanning associations
- Compare circular and linear coordinate layouts
learn_more: Choose the intended data mapping and statistical mode before styling.
  Use chromosome lengths from the correct genome assembly. Inferred maximum interval
  ends are not a complete genome.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: 'Arrange supplied genomic intervals, values and optional links on a circular
    genome. Intervals: chromosome, start, end, value and optional track. Coordinates
    are 0-based, half-open. Optional chromosome/length and source_chr/source_pos/target_chr/target_pos
    link tables.'
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Use chromosome lengths from the correct genome assembly. Inferred maximum
    interval ends are not a complete genome.
- id: caution_2
  title: Interpretation limit 2
  text: Assembly conversion, peak calling and BigWig extraction are upstream operations.
    Track heights use within-track numeric ranges.
