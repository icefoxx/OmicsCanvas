customization:
- parameter: chromosome_column
  label: Chromosome column
  default: chromosome
  help: ''
- parameter: start_column
  label: Start column
  default: start
  help: ''
- parameter: end_column
  label: End column
  default: end
  help: ''
- parameter: value_column
  label: Value column
  default: value
  help: ''
- parameter: group_column
  label: Group column
  default: track
  help: ''
- parameter: layout
  label: Layout
  default: circular
  help: ''
- parameter: track_type
  label: Track type
  default: heatmap
  help: Circular layout only; linear layout uses interval rectangles.
- parameter: gap_angle
  label: Gap angle
  default: 2
  help: Circular layout only; total chromosome gaps must remain below 180 degrees.
- parameter: link_show
  label: Link show
  default: true
  help: ''
- parameter: link_alpha
  label: Link alpha
  default: 0.4
  help: Only with a supplied links table and link_show enabled.
- parameter: point_size
  label: Point size
  default: 2
  help: Circular point track only.
- parameter: line_width
  label: Line width
  default: 0.6
  help: Only for supplied links.
- parameter: link_color
  label: Link color
  default: '#627D96'
  help: Only when links are drawn.
- parameter: low_color
  label: Low color
  default: '#397DA3'
  help: ''
- parameter: high_color
  label: High color
  default: '#CD5865'
  help: ''
- parameter: palette
  label: Palette
  default: Set 2
  help: ''
- parameter: group_colors
  label: Named colors
  default: {}
  help: Named categorical colors override the palette.
- parameter: legend_title
  label: Legend title
  default: ''
  help: ''
- parameter: legend_show
  label: Legend show
  default: true
  help: ''
- parameter: legend_position
  label: Legend position
  default: right
  help: ''
- parameter: legend_text_size
  label: Legend text size
  default: 9
  help: ''
- parameter: label_size
  label: Label size
  default: 2.8
  help: Circular chromosome labels only.
- parameter: title
  label: Title
  default: ''
  help: ''
- parameter: subtitle
  label: Subtitle
  default: ''
  help: Empty uses the automatic description.
- parameter: caption
  label: Caption
  default: ''
  help: ''
- parameter: title_size
  label: Title size
  default: 13
  help: Only when a nonempty title is supplied.
- parameter: font_family
  label: Font family
  default: sans
  help: ''
- parameter: base_size
  label: Base size
  default: 11
  help: ''
- parameter: plot_background
  label: Plot background
  default: '#FFFFFF'
  help: ''
- parameter: grid_show
  label: Grid show
  default: false
  help: ''
- parameter: width
  label: Width
  default: 8
  help: Inches.
- parameter: height
  label: Height
  default: 6
  help: Inches.
- parameter: dpi
  label: Dpi
  default: 150
  help: ''
