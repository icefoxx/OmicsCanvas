summary: Align running enrichment curves and gene-set hits with pathway-gene expression
  heatmaps.
observation_type: observations or summary items in the input table
best_for:
- Connect enrichment to expression evidence
- Compare pathway member genes
- Interpret expression using sample annotations
common_uses: []
input_requirements: Ranked genes, gene sets and a gene-by-sample expression matrix;
  optional precomputed enrichment.
learn_more: 'Input: Ranked genes, gene sets and a gene-by-sample expression matrix;
  optional precomputed enrichment. Interpretation: The enrichment curve comes from
  the ranking and the heatmap from the expression matrix; their scales differ. Check
  mappings, order and transformations before adjusting labels, colors and canvas dimensions.
  Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: The enrichment curve comes from the ranking and the heatmap from the expression
    matrix; their scales differ.
cautions:
- id: caution_1
  title: Caution 1
  text: Shared genes can occur in several pathways
- id: caution_2
  title: Caution 2
  text: Precomputed statistics must match the supplied contrast and ranking
