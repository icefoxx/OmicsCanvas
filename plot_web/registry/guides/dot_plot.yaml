summary: Summarize feature expression across groups using both color and point size,
  optionally with a dendrogram.
observation_type: observations or summary items in the input table
best_for:
- Screen cell-type markers
- Compare expression and detection rates
- Inspect groups with similar marker profiles
common_uses: []
input_requirements: Expression matrix and cell annotations, or feature/group means
  and detection fractions.
learn_more: 'Input: Expression matrix and cell annotations, or feature/group means
  and detection fractions. Interpretation: Color and size encode different statistics
  and require separate legends. Check mappings, order and transformations before adjusting
  labels, colors and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Color and size encode different statistics and require separate legends.
cautions:
- id: caution_1
  title: Caution 1
  text: Feature-wise scaling prevents absolute comparisons between genes
- id: caution_2
  title: Caution 2
  text: Summary dots hide observation-level distributions
examples:
- id: aggregate
  title: Aggregate an expression matrix
  description: 'Use case: Screen cell-type markers. This preset illustrates aggregate
    an expression matrix. Replace its input with your data while retaining the appropriate
    view settings.'
  demo_id: aggregate
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Screen cell-type markers
  input_requirements: Expression matrix and cell annotations, or feature/group means
    and detection fractions.
  preview_asset: plugins/dot_plot/all_examples_gallery/aggregate.png
  variant_id: marker_dot
  mappings:
    row_id_column: gene
    cluster_column: cluster
    cell_column: cell
    x_column: gene
    y_column: cluster
- id: basic
  title: Read a precomputed marker summary
  description: 'Use case: Compare expression and detection rates. This preset illustrates
    read a precomputed marker summary. Replace its input with your data while retaining
    the appropriate view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare expression and detection rates
  input_requirements: Expression matrix and cell annotations, or feature/group means
    and detection fractions.
  preview_asset: plugins/dot_plot/all_examples_gallery/basic.png
  variant_id: marker_dot
  mappings:
    x_column: gene
    y_column: cluster
- id: dendro
  title: Cluster groups by marker profiles
  description: 'Use case: Inspect groups with similar marker profiles. This preset
    illustrates cluster groups by marker profiles. Replace its input with your data
    while retaining the appropriate view settings.'
  demo_id: dendro
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Inspect groups with similar marker profiles
  input_requirements: Expression matrix and cell annotations, or feature/group means
    and detection fractions.
  preview_asset: plugins/dot_plot/all_examples_gallery/dendro.png
  variant_id: marker_dot
  mappings:
    x_column: gene
    y_column: cluster
