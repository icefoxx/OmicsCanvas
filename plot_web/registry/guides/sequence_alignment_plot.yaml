summary: Display aligned DNA or protein sequences with consensus conservation.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Unique sequence IDs and equal-length pre-aligned DNA/protein strings,
  including dash gaps. Alignment is not computed.
best_for:
- Inspect a pre-aligned sequence family
- Compare residue substitutions and gaps
- Summarize per-position consensus fractions
learn_more: Choose the intended data mapping and statistical mode before styling.
  The plugin displays an existing alignment and does not choose an alignment algorithm.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Display aligned DNA or protein sequences with consensus conservation. Unique
    sequence IDs and equal-length pre-aligned DNA/protein strings, including dash
    gaps. Alignment is not computed.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: The plugin displays an existing alignment and does not choose an alignment
    algorithm.
- id: caution_2
  title: Interpretation limit 2
  text: Consensus is the most frequent nongap residue count divided by sequence count,
    not entropy or a phylogenetic test.
examples:
- id: basic
  title: Aligned nucleotide sequences
  description: Inspect a pre-aligned sequence family
  scenario: Inspect a pre-aligned sequence family
  demo_id: basic
  variant_id: basic
  preview_asset: plugins/sequence_alignment_plot/all_examples_gallery/basic.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    id_column: sequence_id
    sequence_column: sequence
- id: protein
  title: Aligned protein sequences
  description: Compare residue substitutions and gaps
  scenario: Compare residue substitutions and gaps
  demo_id: protein
  variant_id: protein
  preview_asset: plugins/sequence_alignment_plot/all_examples_gallery/protein.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    id_column: sequence_id
    sequence_column: sequence
literature_ids:
- figureya_lu_2025
coverage_notes:
- The reference collection is linked as a methodology source. Local demos use independently
  generated data and are not reproductions of its analyses.
- Additional verified published figure/panel examples remain to be curated.
