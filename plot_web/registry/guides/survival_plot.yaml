customization:
- parameter: time_column
  label: Follow-up time
  default: time
  help: ''
- parameter: event_column
  label: Event indicator
  default: event
  help: 0 = right-censored; 1 = event.
- parameter: group_column
  label: Group column
  default: group
  help: ''
- parameter: curve_type
  label: Curve type
  default: survival
  help: ''
- parameter: stat_method
  label: Stat method
  default: none
  help: ''
- parameter: landmark_time
  label: Landmark time
  default: 0
  help: Condition on remaining observed beyond this time; uses original time coordinates.
- parameter: confidence_level
  label: Confidence level
  default: 0.95
  help: ''
- parameter: confidence_show
  label: Confidence show
  default: true
  help: ''
- parameter: confidence_alpha
  label: Confidence alpha
  default: 0.16
  help: Only when confidence_show is enabled.
- parameter: censor_show
