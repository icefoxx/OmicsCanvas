summary: Kaplan–Meier curves with censor marks, confidence bands and numbers at risk.
observation_type: observations or supplied summaries described in the input contract
input_requirements: 'One row per independent observation: numeric nonnegative follow-up
  time, event 0/1 and optional group. Only right censoring is supported.'
best_for:
- Compare survival between cohorts
- Show right-censoring and follow-up coverage
- Display conditional survival beyond a landmark
learn_more: Choose the intended data mapping and statistical mode before styling.
  Competing risks, left censoring and interval censoring require other analyses. 1
  − KM is not a competing-risk cumulative incidence estimator.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: 'Kaplan–Meier curves with censor marks, confidence bands and numbers at risk.
    One row per independent observation: numeric nonnegative follow-up time, event
    0/1 and optional group. Only right censoring is supported.'
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Competing risks, left censoring and interval censoring require other analyses.
    1 − KM is not a competing-risk cumulative incidence estimator.
- id: caution_2
  title: Interpretation limit 2
  text: Log-rank comparisons do not adjust for confounders. Landmark conditioning
    changes the eligible observations.
