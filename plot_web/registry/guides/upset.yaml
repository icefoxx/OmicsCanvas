best_for:
- Compare differential-gene lists
- Find shared and unique members
- Inspect attributes of chosen intersections
common_uses: []
input_requirements: Element IDs with set memberships in the supported wide or long
  layout.
learn_more: 'Input: Element IDs with set memberships in the supported wide or long
  layout. Interpretation: The dot matrix defines a combination and the bar reports
  its size. Check mappings, order and transformations before adjusting labels, colors
  and canvas dimensions. Confirm legends and units before export.'
