summary: Compute or read a correlation matrix and show coefficients using color, numbers
  and triangular layouts.
observation_type: observations or summary items in the input table
best_for:
- Inspect metric redundancy
- Explore covarying features
- Review precomputed correlations
common_uses: []
input_requirements: Raw wide numeric observations, or a square matrix with matching
  row/column labels.
learn_more: 'Input: Raw wide numeric observations, or a square matrix with matching
  row/column labels. Interpretation: Color and numbers represent the chosen correlation
  coefficient; probability annotations require valid tests or supplied results. Check
  mappings, order and transformations before adjusting labels, colors and canvas dimensions.
  Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Color and numbers represent the chosen correlation coefficient; probability
    annotations require valid tests or supplied results.
cautions:
- id: caution_1
  title: Caution 1
  text: Correlation does not establish causation
- id: caution_2
  title: Caution 2
  text: Pairwise missingness can change effective sample sizes between cells
examples:
- id: basic
  title: Correlations from raw observations
  description: 'Use case: Inspect metric redundancy. This preset illustrates correlations
    from raw observations. Replace its input with your data while retaining the appropriate
    view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Inspect metric redundancy
  input_requirements: Raw wide numeric observations, or a square matrix with matching
    row/column labels.
  preview_asset: plugins/interactive_correlation_matrix/all_examples_gallery/basic.png
  mappings:
    id_column: sample
- id: lower_triangle
  title: Nonredundant lower triangle
  description: 'Use case: Explore covarying features. This preset illustrates nonredundant
    lower triangle. Replace its input with your data while retaining the appropriate
    view settings.'
  demo_id: lower_triangle
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Explore covarying features
  input_requirements: Raw wide numeric observations, or a square matrix with matching
    row/column labels.
  preview_asset: plugins/interactive_correlation_matrix/all_examples_gallery/lower_triangle.png
  variant_id: lower_triangle
  mappings:
    id_column: sample
- id: interactive
  title: Inspect individual coefficients on hover
  description: 'Use case: Review precomputed correlations. This preset illustrates
    inspect individual coefficients on hover. Replace its input with your data while
    retaining the appropriate view settings.'
  demo_id: interactive
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Review precomputed correlations
  input_requirements: Raw wide numeric observations, or a square matrix with matching
    row/column labels.
  preview_asset: plugins/interactive_correlation_matrix/all_examples_gallery/interactive.png
  variant_id: interactive
  mappings:
    id_column: sample
