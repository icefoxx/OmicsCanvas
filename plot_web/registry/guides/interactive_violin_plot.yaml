summary: Show grouped continuous distributions as violins with optional points and
  boxes.
observation_type: observations or summary items in the input table
best_for:
- Compare expression or score distributions
- Inspect multimodality and tails
- Arrange distributions by condition
common_uses: []
input_requirements: Numeric wide observations or group/value long data.
learn_more: 'Input: Numeric wide observations or group/value long data. Interpretation:
  Violin width represents estimated density; boxes and points show quantiles and observations.
  Check mappings, order and transformations before adjusting labels, colors and canvas
  dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Violin width represents estimated density; boxes and points show quantiles
    and observations.
cautions:
- id: caution_1
  title: Caution 1
  text: Bandwidth affects apparent multimodality
- id: caution_2
  title: Caution 2
  text: Treating cells as independent replicates inflates evidence
examples:
- id: basic
  title: Grouped continuous distributions
  description: 'Use case: Compare expression or score distributions. This preset illustrates
    grouped continuous distributions. Replace its input with your data while retaining
    the appropriate view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare expression or score distributions
  input_requirements: Numeric wide observations or group/value long data.
  preview_asset: plugins/interactive_violin_plot/all_examples_gallery/basic.png
  mappings:
