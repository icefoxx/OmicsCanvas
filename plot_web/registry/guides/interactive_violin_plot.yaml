- id: long
  title: Group-value mappings from long data
  description: 'Use case: Inspect multimodality and tails. This preset illustrates
    group-value mappings from long data. Replace its input with your data while retaining
    the appropriate view settings.'
  demo_id: long
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Inspect multimodality and tails
  input_requirements: Numeric wide observations or group/value long data.
  preview_asset: plugins/interactive_violin_plot/all_examples_gallery/long.png
