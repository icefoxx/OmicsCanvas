  table.
learn_more: 'Input: Source-target edges; optional weights, groups and an ordered node
  table. Interpretation: Arcs connect edge endpoints and their spans depend on node
  order. Check mappings, order and transformations before adjusting labels, colors
  and canvas dimensions. Confirm legends and units before export.'
