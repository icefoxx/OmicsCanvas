summary: Compare cumulative distributions with optional distribution-free confidence
  bands.
observation_type: observations or supplied summaries described in the input contract
input_requirements: One finite numeric value per independent observation and optional
  group. Two-sample tests require exactly two groups; pairing is not inferred.
best_for:
- Compare continuous score distributions
- Show cumulative fold-change patterns
- Display empirical distributions with simultaneous DKW bands
learn_more: Choose the intended data mapping and statistical mode before styling.
  DKW bands assume independent observations and are simultaneous within each group,
  without adjustment across groups.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Compare cumulative distributions with optional distribution-free confidence
    bands. One finite numeric value per independent observation and optional group.
    Two-sample tests require exactly two groups; pairing is not inferred.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: DKW bands assume independent observations and are simultaneous within each
    group, without adjustment across groups.
- id: caution_2
  title: Interpretation limit 2
  text: Wilcoxon and KS answer different questions. Neither is a paired or repeated-measure
    test here.
