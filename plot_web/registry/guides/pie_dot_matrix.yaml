summary: Use ratio or segmented circles in a matrix to show fractions, binary states
  or correlations.
observation_type: observations or summary items in the input table
best_for:
- Compare detection fractions
- Inspect binary feature states
- Survey correlation direction and strength
common_uses: []
input_requirements: Row/column identifiers and proportions, states or coefficients
  appropriate to the active mode.
learn_more: 'Input: Row/column identifiers and proportions, states or coefficients
  appropriate to the active mode. Interpretation: Read circle filling or segmentation
  using the active mode''s legend. Check mappings, order and transformations before
  adjusting labels, colors and canvas dimensions. Confirm legends and units before
  export.'
