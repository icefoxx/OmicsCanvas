summary: Show the relationship between two numeric variables using scatter and fitted
  trends.
observation_type: observations or summary items in the input table
best_for:
- Explore dose-response relationships
- Compare experimental metrics
- Inspect model fit and outliers
common_uses: []
input_requirements: Two numeric columns with optional group and label fields.
learn_more: 'Input: Two numeric columns with optional group and label fields. Interpretation:
  Points represent observations and the fit summarizes the chosen model. Check mappings,
  order and transformations before adjusting labels, colors and canvas dimensions.
  Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Points represent observations and the fit summarizes the chosen model.
cautions:
- id: caution_1
  title: Caution 1
  text: Regression or correlation does not establish causation
- id: caution_2
  title: Caution 2
  text: Nonlinearity, outliers and dependent observations affect inference
examples:
- id: basic
  title: Two-variable scatter and fit
  description: 'Use case: Explore dose-response relationships. This preset illustrates
    two-variable scatter and fit. Replace its input with your data while retaining
    the appropriate view settings.'
  demo_id: basic
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Explore dose-response relationships
  input_requirements: Two numeric columns with optional group and label fields.
  preview_asset: plugins/regression_scatter_plot/all_examples_gallery/basic.png
  mappings:
    x_column: x
    y_column: y
    group_column: group
    id_column: id
- id: CAB_demo
  title: Reference-style regression presentation
  description: 'Use case: Compare experimental metrics. This preset illustrates reference-style
    regression presentation. Replace its input with your data while retaining the
    appropriate view settings.'
  demo_id: CAB_demo
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare experimental metrics
  input_requirements: Two numeric columns with optional group and label fields.
  preview_asset: plugins/regression_scatter_plot/all_examples_gallery/CAB_demo.png
  variant_id: cab_demo
  mappings:
    x_column: x
    y_column: y
    group_column: group
    id_column: id
