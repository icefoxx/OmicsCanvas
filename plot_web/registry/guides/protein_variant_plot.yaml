summary: Place variant counts and annotated domains on a protein coordinate.
observation_type: observations or supplied summaries described in the input contract
input_requirements: Protein residue position (1-based), supplied count, optional variant
  label/group. Optional domains CSV has start, end and domain.
best_for:
- Locate recurrent variants along a protein
- Relate variant positions to supplied domains
- Compare supplied variant counts and classes
learn_more: Choose the intended data mapping and statistical mode before styling.
  Protein coordinates are 1-based residue coordinates, not genomic base-pair positions.
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Place variant counts and annotated domains on a protein coordinate. Protein
    residue position (1-based), supplied count, optional variant label/group. Optional
    domains CSV has start, end and domain.
cautions:
- id: caution_1
  title: Interpretation limit 1
  text: Protein coordinates are 1-based residue coordinates, not genomic base-pair
    positions.
- id: caution_2
  title: Interpretation limit 2
  text: The plugin does not annotate variants or infer pathogenicity. Domain positions
    and protein length are supplied.
examples:
- id: basic
  title: Protein variants and domains
  description: Locate recurrent variants along a protein
  scenario: Locate recurrent variants along a protein
  demo_id: basic
  variant_id: basic
  preview_asset: plugins/protein_variant_plot/all_examples_gallery/basic.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    position_column: position
    value_column: count
    label_column: variant
    group_column: group
- id: variants_only
  title: Variant count profile
  description: Relate variant positions to supplied domains
  scenario: Relate variant positions to supplied domains
  demo_id: variants_only
  variant_id: variants_only
  preview_asset: plugins/protein_variant_plot/all_examples_gallery/variants_only.png
  data_note: Independent synthetic demonstration, not original publication data.
  mappings:
    position_column: position
    value_column: count
    label_column: variant
    group_column: group
literature_ids:
