    feature_column: gene
    value_column: value
    group_column: cluster
- id: matrix
  title: Multifeature multigroup distribution matrix
  description: 'Use case: Interpret expression with annotations. This preset illustrates
    multifeature multigroup distribution matrix. Replace its input with your data
    while retaining the appropriate view settings.'
  demo_id: matrix
