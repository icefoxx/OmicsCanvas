summary: Compare continuous feature distributions using grouped violins, annotations,
  points or matrix layouts.
observation_type: observations or summary items in the input table
best_for:
- Compare marker distributions within groups
- Inspect heterogeneity behind group means
- Interpret expression with annotations
common_uses: []
input_requirements: Feature-expression or numeric data with population and optional
  sample annotations.
learn_more: 'Input: Feature-expression or numeric data with population and optional
  sample annotations. Interpretation: Violin width shows estimated density and overlaid
  points show observations. Check mappings, order and transformations before adjusting
  labels, colors and canvas dimensions. Confirm legends and units before export.'
interpretation:
- id: encoding
  type: direct
  title: How to read this plot
  text: Violin width shows estimated density and overlaid points show observations.
cautions:
- id: caution_1
  title: Caution 1
  text: Width normalization can obscure differences in sample size
- id: caution_2
  title: Caution 2
  text: Distinguish zeros from missing values
examples:
- id: anno
  title: Distributions with annotations
  description: 'Use case: Compare marker distributions within groups. This preset
    illustrates distributions with annotations. Replace its input with your data while
    retaining the appropriate view settings.'
  demo_id: anno
  data_note: Local demonstration bundle, not the original data of a cited paper.
  scenario: Compare marker distributions within groups
  input_requirements: Feature-expression or numeric data with population and optional
    sample annotations.
  preview_asset: plugins/violin_plot/all_examples_gallery/anno.png
  variant_id: anno
  mappings:
    cell_id_column: cell
    feature_column: gene
    value_column: value
    group_column: cluster
    annotation_column: category
- id: dot
  title: Distributions and raw points
