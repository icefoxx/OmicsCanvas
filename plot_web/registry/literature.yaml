      annotation.
  - id: liu_cellres_2025_panel_22
    figure: Figure 2E-F
    title: Dataset size distributions
    description: Binned cell-type and cell-count frequencies.
    plot_families:
    - interactive_histogram_plot
    figure_url: https://www.nature.com/articles/s42003-025-08457-2#Fig2
    evidence_url: https://www.nature.com/articles/s42003-025-08457-2
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Start from dataset-level observations and use explicit bin boundaries;
      log-transform counts only when stated.
  - id: liu_cellres_2025_panel_23
    figure: Figure 2C
    title: Treatment counts and combinations
    description: Therapy counts with dataset treatment indicators.
    plot_families:
    - combo_bar_dot_matrix
    figure_url: https://www.nature.com/articles/s42003-025-08457-2#Fig2
    evidence_url: https://www.nature.com/articles/s42003-025-08457-2
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: related_layout
    adaptation: 'Related composite: derive aligned categories for the local bar-plus-matrix
      layout; do not relabel intersection bars as performance scores.'
- id: chen_ibd_2025
