    Python workflow for multiplexed image processing and analysis. Nature Communications.'
  reference_type: published_use_case
  publication_status: published
  thumbnail_reuse_allowed: false
  license: Linked to the source; no original figure is reproduced here.
  verified_on: '2026-10-25'
  description: See the figure-specific examples curated for this plot family.
