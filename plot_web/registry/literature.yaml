  - id: liu_cellres_2025_panel_21
    figure: Figure 2D
    title: Rank treatment frequencies
    description: Drug-use counts across datasets.
    plot_families:
    - classified_bar_plot
    figure_url: https://www.nature.com/articles/s42003-025-08457-2#Fig2
    evidence_url: https://www.nature.com/articles/s42003-025-08457-2
