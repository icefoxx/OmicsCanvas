  year: 2018
  doi: ''
  url: https://arxiv.org/abs/1802.03426
  figure: ''
  license: arXiv preprint (see paper for terms)
  thumbnail_reuse_allowed: false
  description: Introduces UMAP as a neighborhood-preserving dimension-reduction method
    used for 2D embeddings.
