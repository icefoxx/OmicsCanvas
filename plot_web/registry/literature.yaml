  - umap_tsne
  - ternary_plot
  - interactive_network_plot
  figure_examples:
  - id: tan_spacec_2025_panel_17
    figure: Figure 2B
    title: Spatial-imaging cell annotations
    description: Annotated tonsil cells on UMAP.
    plot_families:
    - umap_tsne
    figure_url: https://www.nature.com/articles/s41467-025-65658-3#Fig2
    evidence_url: https://www.nature.com/articles/s41467-025-65658-3
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Supply computed coordinates and labels; segmentation and annotation
      are upstream.
  - id: tan_spacec_2025_panel_18
    figure: Figure 2G
    title: Three-neighborhood composition
    description: Barycentric neighborhood combinations.
    plot_families:
    - ternary_plot
    figure_url: https://www.nature.com/articles/s41467-025-65658-3#Fig2
    evidence_url: https://www.nature.com/articles/s41467-025-65658-3
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Select exactly three nonnegative neighborhood fractions with a positive
      total.
  - id: tan_spacec_2025_panel_19
    figure: Figure 2I
    title: Condition-specific cellular interactions
    description: Distance-based cell interaction networks.
    plot_families:
    - interactive_network_plot
    figure_url: https://www.nature.com/articles/s41467-025-65658-3#Fig2
    evidence_url: https://www.nature.com/articles/s41467-025-65658-3
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Use precomputed edges and effects; permutation tests are not performed
      by this renderer.
