entries:
- id: hao_dnt_2026
  title: A pan-cancer single cell landscape reveals heterogeneity and functional diversity
    of double-negative T cells
  authors: Hao Q, Zhou T, Yan H, et al.
  citation: Hao Q, Zhou T, Yan H, et al. A pan-cancer single cell landscape reveals
    heterogeneity and functional diversity of double-negative T cells. Molecular Cancer.
    2026;25:24.
  journal: Molecular Cancer
  year: 2026
  doi: 10.1186/s12943-025-02548-8
  url: https://link.springer.com/article/10.1186/s12943-025-02548-8
  figure: Figure 6L
  license: 'Article: CC BY-NC-ND 4.0; original figure not reproduced here.'
  thumbnail_reuse_allowed: false
  description: Profiles double-negative T-cell states across cancers.
  relevance: The panels below illustrate different ways to display cell states, marker
    evidence and comparisons.
  use_case:
  - single_cell
  - differential_expression
  - ranking
  plot_families:
  - enrichment_lollipop
  - umap_tsne
  - feature_embedding
  - dot_plot
  - stacked_bar_plot
  - stat_plot
  - interactive_radar_plot
  - hierarchical_marker_panel
  - interactive_pie_plot
  - balloon_plot
  - grouped_heatmap
  - interactive_clustered_heatmap_plot
  - threshold_matrix_heatmap
  - classified_bar_plot
  - go_kegg_enrichment_bar_bubble
  - upset
  - line_plot
  - trajectory
  - quadrant_correlation_scatter
  - regression_scatter_plot
  - highlight_effect_plot
  reference_type: published_use_case
  figure_examples:
  - id: hao_dnt_2026_panel_1
    figure: Figure 1B
    title: Annotated T-cell embedding
    description: Cell-type labels on UMAP.
    plot_families:
    - umap_tsne
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/1
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Supply embedding coordinates and cell annotations; the renderer does
      not integrate datasets.
  - id: hao_dnt_2026_panel_2
    figure: Figure 1C
    title: Marker expression on UMAP
    description: Marker values on the embedding.
    plot_families:
    - feature_embedding
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/1
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Use the same coordinates for feature maps; state expression transformations.
  - id: hao_dnt_2026_panel_3
    figure: Figure 1D
    title: Marker evidence across populations
    description: Marker means and detection fractions.
    plot_families:
    - dot_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/1
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Provide group-level means and fractions or a compatible expression
      matrix.
  - id: hao_dnt_2026_panel_4
    figure: Figure 1F
    title: DNT composition across samples
    description: Stacked cell-type proportions.
    plot_families:
    - stacked_bar_plot
    - stat_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/1
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Specify the denominator and retain sample-level categories.
  - id: hao_dnt_2026_panel_5
    figure: Figure 1H
    title: Multifunctional cell-state profiles
    description: Functions compared across cell types.
    plot_families:
    - interactive_radar_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/1
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Provide comparable functional scores and explicitly set radial scaling.
  - id: hao_dnt_2026_panel_6
    figure: Figure 2B
    title: Markers alongside population frequency
    description: Marker heatmap with frequency bars.
    plot_families:
    - hierarchical_marker_panel
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/2
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: related_layout
    adaptation: 'Related composite: the local panel adds explicit hierarchy labels
      and uses its own marker encodings.'
  - id: hao_dnt_2026_panel_7
    figure: Figure 2D
    title: Population abundance across cancers
    description: Population frequencies and cancer-type composition.
    plot_families:
    - interactive_pie_plot
    - balloon_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/2
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Select the pie or sized-matrix component; the local plugin does not
      assemble the entire original composite.
  - id: hao_dnt_2026_panel_8
    figure: Figure 2E
    title: Functional-activity heatmap
    description: Cytokine activities across DNT subsets.
    plot_families:
    - grouped_heatmap
    - interactive_clustered_heatmap_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/2
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Use a precomputed population-by-activity matrix; activity inference
      is upstream.
  - id: hao_dnt_2026_panel_9
    figure: Figure 2F
    title: Pathway evidence across populations
    description: Adjusted probabilities for shared pathways.
    plot_families:
    - threshold_matrix_heatmap
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/2
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: related_layout
    adaptation: 'Related encoding: choose explicit probability bins; the paper uses
      a continuous significance scale.'
  - id: hao_dnt_2026_panel_10
    figure: Figure 2G
    title: Ranked biological-process enrichment
    description: Bars summarize pathway enrichment evidence.
    plot_families:
    - classified_bar_plot
    - go_kegg_enrichment_bar_bubble
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/2
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: related_layout
    adaptation: The source supplies enrichment bars; counts and extra bubble encodings
      require separate data and are not inferred.
  - id: hao_dnt_2026_panel_11
    figure: Figure 3D
    title: Shared receptor clonotypes
    description: TCR overlap across cell subsets.
    plot_families:
    - upset
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/3
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Use clonotype IDs and subset memberships with an explicit intersection
      definition.
  - id: hao_dnt_2026_panel_12
    figure: Figure 3E-F
    title: Marker changes along pseudotime
    description: Expression trends along inferred trajectories.
    plot_families:
    - line_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/3
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Provide ordered values or upstream fits; confidence bands and trajectory
      inference are not automatically reproduced.
  - id: hao_dnt_2026_panel_13
    figure: Figure 3A
    title: Differentiation paths on an embedding
    description: RNA-velocity trajectories on UMAP.
    plot_families:
    - trajectory
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/3
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: related_layout
    adaptation: 'Related layout: supply precomputed paths. This plugin does not compute
      velocity or reproduce velocity streamlines.'
  - id: hao_dnt_2026_panel_14
    figure: Figure 4D
    title: Compare two differential effects
    description: Effects in two tissue contrasts.
    plot_families:
    - quadrant_correlation_scatter
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/4
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Choose biologically justified thresholds; probability-driven mark
      encodings require compatible fields.
  - id: hao_dnt_2026_panel_15
    figure: Figure 6L
    title: Opposing TF signatures
    description: Signed TF effects in Grm1 versus Grm2.
    plot_families:
    - enrichment_lollipop
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/6
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Use a signed contrast table with TF names and probabilities; the local
      starter is synthetic.
  - id: hao_dnt_2026_panel_16
    figure: Figure 6M
    title: Compare cytokine enrichment contrasts
    description: Cytokine scores compared across contrasts.
    plot_families:
    - regression_scatter_plot
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8/figures/6
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
    match_type: same_grammar
    adaptation: Provide the two score columns and report the chosen association statistic;
      no causal claim follows.
  - id: hao_dnt_2026_extra_12
    figure: Figure 1L
    plot_families:
    - highlight_effect_plot
    title: Effects and uncertainty across cohorts
    description: Adjusted survival effects with confidence intervals.
    adaptation: 'Related layout: transform hazard ratios and interval limits to log
      scale for a zero-centered effect plot. Background-cloud collapsing is a local
      option absent from the source.'
    match_type: related_layout
    figure_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    evidence_url: https://link.springer.com/article/10.1186/s12943-025-02548-8
    verification: primary_source_caption
    verified_on: '2026-10-25'
- id: umap_mcinnes_2018
