name: vNext framework

on:
  push:
    paths:
      - "vnext/**"
      - "plugins/interactive_enrichment_lollipop/vnext/**"
      - ".github/workflows/vnext.yml"
  pull_request:
    paths:
      - "vnext/**"
      - "plugins/interactive_enrichment_lollipop/vnext/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pyyaml jsonschema pytest
      - name: Build registry
        run: python -m vnext.cli registry build
      - name: Unit tests
        run: pytest -q vnext/tests
      - name: PlotSpec roundtrip
        run: python -m vnext.cli roundtrip --spec plugins/interactive_enrichment_lollipop/vnext/examples/oct4_expected_spec.json
      - name: Validate OCT4 example
        run: |
          python -m vnext.cli validate \
            --spec plugins/interactive_enrichment_lollipop/vnext/examples/oct4_expected_spec.json \
            --input plugins/interactive_enrichment_lollipop/examples/oct4_enrichment/input/example_input.csv
